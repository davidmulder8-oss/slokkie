<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16121f">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Slokkie: het drankspel dat iedereen op de eigen telefoon speelt.">
<title>Slokkie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16121f;--card:#221b30;--card2:#2d2440;--line:#3c3156;--cream:#fff4d6;--ink:#16121f;
  --txt:#f6efff;--mute:#a99cc4;--red:#ff4d5e;--yellow:#ffc93c;--green:#3ddc84;
  --k0:#e21b3c;--k1:#1368ce;--k2:#d89e00;--k3:#26890c;
  --sl:max(16px,env(safe-area-inset-left));--sr:max(16px,env(safe-area-inset-right));
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Figtree,system-ui,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(120% 60% at 0% -10%,rgba(255,93,115,.16),transparent 55%),radial-gradient(90% 50% at 110% 15%,rgba(255,201,60,.10),transparent 60%),radial-gradient(100% 60% at 50% 115%,rgba(124,77,255,.16),transparent 60%),var(--bg);background-attachment:fixed}
button{font-family:inherit;cursor:pointer;color:inherit}
.disp{font-family:"Bowlby One",Figtree,sans-serif;font-weight:400}
.in{max-width:560px;margin:0 auto}
h2{font:400 22px "Bowlby One";margin:22px 0 10px}
h3{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:22px 0 8px;font-weight:800}
p{line-height:1.45}
.sub{color:var(--mute);margin:4px 0 12px;font-size:15px}
.center{text-align:center}

/* top bar */
#top{position:sticky;top:0;z-index:5;background:rgba(22,18,31,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding-top:env(safe-area-inset-top)}
#top:empty{display:none}
.topin{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px var(--sr) 8px var(--sl)}
.codechip{display:flex;align-items:center;gap:8px;background:var(--cream);color:var(--ink);border:0;border-radius:12px;padding:0 12px;min-height:44px;font-size:20px;letter-spacing:.06em}
.net{width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(255,77,94,.3)}
.net.ok{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.3)}
.rnd{font-weight:800;color:var(--mute);font-size:15px;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mine{display:flex;align-items:center;gap:6px;font-weight:700;background:var(--card);border-radius:12px;padding:0 12px;min-height:44px}
.mine .disp{font-size:22px}

/* main */
#app{max-width:560px;margin:0 auto;padding:10px var(--sr) calc(40px + env(safe-area-inset-bottom)) var(--sl)}
body.hasbar #app{padding-bottom:calc(116px + env(safe-area-inset-bottom))}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(rgba(22,18,31,0),var(--bg) 32%);padding:22px var(--sr) calc(12px + env(safe-area-inset-bottom)) var(--sl)}
#bar:empty{display:none}
.barin{display:flex;gap:10px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:18px;font:800 18px Figtree,sans-serif;color:var(--txt);background:var(--card2);padding:10px 18px;transition:transform .08s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.cream{background:var(--cream);color:var(--ink);box-shadow:0 5px 0 #c9b98f}
.btn.cream:active{box-shadow:0 2px 0 #c9b98f;transform:translateY(3px)}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.stop{width:auto;flex:0 0 auto;color:var(--mute);padding:0 20px}
.btn.red{background:var(--red);color:#fff;box-shadow:0 5px 0 #a62635}
.btn.green{background:var(--green);color:var(--ink);box-shadow:0 5px 0 #1f8a50}
.btn[disabled]{opacity:.4}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:15px;min-height:48px;padding:0 12px;display:block;margin:18px auto 0}
.mini{background:rgba(0,0,0,.25);border:0;border-radius:10px;padding:8px 12px;font-weight:700;color:#fff;min-height:40px}

/* home */
.logo{margin:14px auto 0;text-align:center;line-height:0}
.logo img{width:min(82%,340px);height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.tag{text-align:center;color:var(--mute);margin:10px 0 26px;font-weight:600}
.lbl{display:block;font-weight:800;font-size:14px;color:var(--mute);margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--txt);font:700 19px Figtree,sans-serif;padding:0 16px;outline:none;margin-bottom:14px}
.inp:focus{border-color:var(--cream)}
.inp.code{font-family:"Bowlby One";font-size:32px;letter-spacing:.3em;text-align:center;text-transform:uppercase;padding-left:calc(16px + .3em)}
.box{background:var(--card);border-radius:22px;padding:16px;margin:8px 0}
.box .inp{background:var(--bg)}
.or{text-align:center;color:var(--mute);margin:14px 0;font-weight:700}
.err{background:rgba(255,77,94,.15);color:#ff9aa5;border-radius:14px;padding:12px 14px;font-weight:700}
.foot{text-align:center;color:var(--mute);font-size:14px;margin-top:28px}

/* lobby */
.codecard{background:var(--cream);color:var(--ink);border-radius:26px;padding:18px 16px 16px;text-align:center;margin-top:6px}
.codecard .lbl{color:#6f6150;margin:0}
.bigcode{font-size:clamp(56px,18vw,78px);letter-spacing:.1em;line-height:1.1;padding-left:.1em}
.qr{width:180px;max-width:60%;margin:8px auto;background:#fff;border-radius:14px;padding:6px}
.qr svg{display:block;width:100%;height:auto}
.codecard p{margin:6px 0 10px;font-size:14px;color:#5b4f40;font-weight:600}
.codecard .mini{background:var(--ink);color:var(--cream)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:0;border-radius:999px;padding:5px 14px 5px 5px;font-weight:700;font-size:16px;min-height:46px;max-width:100%;color:var(--txt)}
.chip.off{opacity:.45}
.chip.self{box-shadow:inset 0 0 0 2px var(--cream)}
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:400 17px "Bowlby One";color:var(--ink);font-style:normal;flex:0 0 auto}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:58px;background:var(--card);border:0;border-radius:16px;padding:8px 16px;color:var(--txt);font:700 17px Figtree,sans-serif;margin-bottom:8px;text-align:left}
.tog small{display:block;font-weight:600;color:var(--mute);font-size:13px}
.sw{width:48px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:0 0 auto;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on .sw{background:var(--green)}
.tog.on .sw:after{left:21px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:58px;border:0;border-radius:14px;background:var(--card);font:800 17px Figtree,sans-serif}
.seg button.on{background:var(--cream);color:var(--ink)}
.modes{display:grid;gap:8px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:2px solid transparent;border-radius:18px;padding:12px 14px;min-height:72px;width:100%}
.mode.on{border-color:var(--cream);background:var(--card2)}
.mode .e{font-size:30px}
.mode b{display:block;font:400 19px "Bowlby One"}
.mode small{color:var(--mute);font-size:14px;font-weight:600}
.hint{color:var(--mute);font-size:14px;margin:8px 2px 0}
.summary{background:var(--card);border-radius:18px;padding:14px 16px;line-height:1.6}
.summary b{color:var(--cream)}

/* rounds */
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.pill{background:var(--card2);border-radius:99px;padding:7px 13px;font-weight:800;font-size:14px}
.tnum{font-size:28px;min-width:40px;text-align:right}
.tbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
.tbar i{display:block;height:100%;width:100%;background:var(--cream);border-radius:99px;transition:width .2s linear}
.pre{color:var(--mute);font-weight:800;margin:20px 0 0;font-size:16px}
.q{font:400 clamp(22px,6.4vw,30px)/1.22 "Bowlby One";margin:8px 0 18px;overflow-wrap:anywhere}
.count{text-align:center;color:var(--mute);font-weight:700;margin:16px 0 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:116px;border:0;border-radius:16px;color:#fff;font:800 17px/1.25 Figtree,sans-serif;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.35);overflow-wrap:anywhere}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.tile svg,.shape svg{width:30px;height:30px;fill:#fff;flex:0 0 auto}
.k0{background:var(--k0)}.k1{background:var(--k1)}.k2{background:var(--k2)}.k3{background:var(--k3)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{display:flex;align-items:center;gap:10px;min-height:62px;border:0;border-radius:16px;background:var(--card);padding:8px 10px;font:800 16px Figtree,sans-serif;text-align:left;overflow-wrap:anywhere}
.pbtn:active{background:var(--card2)}
.two{display:grid;gap:10px}
.bigopt{min-height:96px;border:0;border-radius:20px;font:400 24px "Bowlby One";color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.35);padding:10px 16px;overflow-wrap:anywhere}
.bigopt:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.o-red{background:#e5384b}.o-green{background:#22a862}.o-org{background:#f08a24}.o-blue{background:#2f7de1}.o-black{background:#2a2433;border:2px solid #5a4f6d}
.vs{text-align:center;font:400 18px "Bowlby One";color:var(--mute)}
.waitbox{background:var(--card);border-radius:20px;padding:22px 16px;text-align:center;margin-top:8px}
.waitbox b{display:block;font:400 22px "Bowlby One";margin-top:10px}
.waitbox span{color:var(--mute);font-weight:600}
.spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--cream);margin:0 auto;animation:rot 0.9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.tapbtn{display:block;width:min(78vw,320px);aspect-ratio:1/1;border-radius:50%;margin:26px auto 10px;border:0;font:400 36px "Bowlby One";color:#fff;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tapbtn.wait{background:#c2304a;box-shadow:0 10px 0 #7d1d30}
.tapbtn.go{background:#22b56c;box-shadow:0 10px 0 #157a47;animation:pop .25s ease-out}
.tapbtn.done{background:var(--card2);color:var(--mute);box-shadow:none;font-size:26px}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}

/* wheel */
.wheelwrap{position:relative;width:min(80vw,330px);aspect-ratio:1/1;margin:22px auto}
.wheel{position:absolute;inset:0;border-radius:50%;border:7px solid var(--cream);box-shadow:0 12px 30px rgba(0,0,0,.45);animation:spin 3.8s cubic-bezier(.12,.8,.22,1) forwards}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(var(--end))}}
.wheel span{position:absolute;inset:0;display:flex;justify-content:center;padding-top:7%}
.wheel b{font:400 clamp(14px,4.6vw,22px) "Bowlby One";color:var(--ink)}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:30px solid var(--cream);filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.hub{position:absolute;inset:40%;border-radius:50%;background:var(--cream);z-index:1;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,6vw,28px)}

/* dare */
.dare{background:var(--cream);color:var(--ink);border-radius:24px;padding:20px 18px;margin:14px 0;position:relative}
.dare .tagl{display:inline-block;background:var(--ink);color:var(--cream);border-radius:99px;padding:5px 12px;font-weight:800;font-size:13px}
.dare .txt{font:400 clamp(20px,5.8vw,26px)/1.28 "Bowlby One";margin:12px 0 4px;overflow-wrap:anywhere}
.turn{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin:6px 0 14px}

/* result */
.me{border-radius:22px;padding:16px;margin:12px 0 6px;color:var(--ink)}
.me.red{background:var(--red);color:#fff}
.me.yellow{background:var(--yellow)}
.me.green{background:var(--green)}
.me.grey{background:var(--card);color:var(--txt)}
.me .row{display:flex;align-items:center;gap:14px}
.me .big{font:400 58px/1 "Bowlby One";min-width:46px;text-align:center}
.me b{display:block;font:400 22px/1.15 "Bowlby One"}
.me small{display:block;opacity:.9;font-size:15px;margin-top:4px;font-weight:600}
.givegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.givebtn{display:flex;align-items:center;gap:8px;min-height:58px;border:0;border-radius:14px;background:var(--ink);color:var(--cream);padding:6px 10px;font:800 16px Figtree,sans-serif;text-align:left;overflow-wrap:anywhere}
.givebtn:active{transform:scale(.96)}
.givebtn .av{width:32px;height:32px;font-size:15px}
.note{font-weight:700;color:var(--cream);margin:10px 0}
.bars{background:var(--card);border-radius:18px;padding:6px 14px 10px}
.barrow{margin:10px 0}
.bl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.bl span{display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.bl .shape svg{width:18px;height:18px}
.bt{height:12px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:5px}
.bt i{display:block;height:100%;border-radius:99px;background:var(--mute);min-width:4px}
.barrow.hi .bl{color:var(--green)}
.dl{display:grid;gap:6px}
.dl .row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 12px}
.dl .nm{flex:1;min-width:0;font-weight:800;overflow-wrap:anywhere}
.dl .nm small{display:block;color:var(--mute);font-weight:600;font-size:13px}
.dl .n{font:400 26px "Bowlby One";color:#ff8a96}
.dl .n.g{color:var(--yellow);font-size:18px}
.empty{background:var(--card);border-radius:16px;padding:14px;text-align:center;color:var(--mute);font-weight:700}
.pending{color:var(--yellow);font-weight:700;margin:8px 0}
.banner{background:var(--red);color:#fff;border-radius:14px;padding:8px 8px 8px 14px;margin:6px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}

/* end */
.crown{text-align:center;font-size:44px;margin-top:10px}
.etitle{font:400 34px "Bowlby One";text-align:center;margin:0 0 6px}
.etab{display:grid;gap:6px;margin-top:14px}
.erow{display:grid;grid-template-columns:26px 1fr 76px 76px;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:10px 12px;min-height:58px}
.erow.th{background:none;min-height:0;padding:0 12px;color:var(--mute);font-size:12px;font-weight:800}
.erow .rk{font:400 18px "Bowlby One";color:var(--mute)}
.erow .who{display:flex;align-items:center;gap:8px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.erow .num{text-align:center;font:400 22px "Bowlby One"}
.erow .num.g{color:var(--yellow)}
.erow.first{background:var(--cream);color:var(--ink)}
.erow.first .rk{color:var(--ink)}
.busnote{background:var(--card);border-radius:16px;padding:12px 14px;text-align:center;font-weight:700;margin-top:10px}

/* cards */
.pc{width:52px;height:74px;border-radius:9px;background:linear-gradient(160deg,#fff 0%,#fff8e6 100%);color:#1b1626;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font:400 22px/1 "Bowlby One";box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.08);flex:0 0 auto;position:relative}
.pc>b{font-weight:400;line-height:1}
.pc>span{font-size:.95em;line-height:1.05;font-family:system-ui,sans-serif}
.pc .ci{position:absolute;top:3px;left:4px;display:flex;flex-direction:column;align-items:center;font:400 max(9px,.38em)/1 "Bowlby One";font-style:normal}
.pc .ci small{font:max(8px,.36em)/1 system-ui,sans-serif}
.pc .ci.br{top:auto;left:auto;bottom:3px;right:4px;transform:rotate(180deg)}
.pc.face{background:linear-gradient(160deg,#fff 0%,#ffeec2 100%);box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 0 0 3px #fff,inset 0 0 0 4px #e8c26a}
.pc.r{color:#d81e3c}
.pc.back{background:url(img/beer.webp) center/52% no-repeat,radial-gradient(circle at 50% 50%,#3a2d55 0 40%,transparent 41%),repeating-linear-gradient(45deg,#e5384b 0 6px,#b52a3f 6px 12px);border:3px solid var(--cream)}
.pc.next{background:var(--card2);border:2px dashed var(--mute);color:var(--mute);box-shadow:none}
.pc.used{opacity:.28}
.pc.hl{outline:3px solid var(--yellow);outline-offset:2px}
.pc.big{width:92px;height:130px;font-size:38px;border-radius:14px}
.pc.big span{font-size:34px}
.hand{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 14px}
.pyr{display:grid;gap:8px;margin:16px 0 8px}
.prow{display:flex;justify-content:center;align-items:center;gap:6px;position:relative}
.prow .x{position:absolute;left:0;font:400 14px "Bowlby One";color:var(--mute)}
.pyr .pc{width:min(14.5vw,58px);height:calc(min(14.5vw,58px)*1.4);font-size:min(4.6vw,20px)}
.pyr .pc span{font-size:min(4.4vw,18px)}
.busrow{display:flex;justify-content:center;gap:6px;margin:18px 0 6px}
.busrow .slot{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;color:var(--mute);font-size:13px}
.busrow .pc{width:min(13.2vw,58px);height:calc(min(13.2vw,58px)*1.4);font-size:min(4.4vw,20px)}
.busrow .pc span{font-size:min(4.2vw,18px)}
.busrow .slot.cur{color:var(--yellow)}
.cardlist .pc{width:38px;height:54px;font-size:15px}
.cardlist .pc span{font-size:14px}
.cardlist .pc .ci{display:none}
.ok{color:var(--green);font-weight:800}.ko{color:#ff8a96;font-weight:800}

.av.lg{width:58px;height:58px;font-size:26px}
.av.xl{width:104px;height:104px;font-size:44px}
img.av{object-fit:cover;border:2px solid var(--line);background:var(--card2)}
.avpick{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px auto 16px;cursor:pointer;font-weight:800;color:var(--cream);min-height:58px}
.avpick.small{margin:0;min-height:0}
.profcard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px;margin:18px 0 8px}
.profcard .pc-info{flex:1;min-width:0}
.profcard b{display:block;font:400 20px "Bowlby One";overflow-wrap:anywhere}
.profcard small{color:var(--mute);font-weight:600;font-size:13px}
.givebtn[disabled]{opacity:.45}
.givebtn small{display:block;font-size:12px;opacity:.8}
.king{text-align:center;background:var(--cream);color:var(--ink);border-radius:26px;padding:22px 16px 18px;margin-top:8px;position:relative}
.king .av{border:4px solid var(--ink)}
.kcrown{font-size:40px;line-height:1;margin-top:-6px}
.klbl{font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:#6f6150;margin-top:4px}
.kname{font:400 32px/1.1 "Bowlby One";overflow-wrap:anywhere}
.ksub{font-weight:700;margin-top:4px}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.award{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.award .ae{font-size:24px}
.award small{color:var(--mute);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.award b{font:400 18px "Bowlby One";overflow-wrap:anywhere}
.award .as{color:var(--mute);font-size:13px;font-weight:600}
.hist{display:grid;gap:6px}
.hist details{background:var(--card);border-radius:16px}
.hist summary{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:58px;cursor:pointer;list-style:none}
.hist summary::-webkit-details-marker{display:none}
.hn{width:32px;height:32px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.ht{flex:1;min-width:0}
.ht b{display:block;font-weight:800}
.ht small{display:block;color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.hs{font:400 18px "Bowlby One";color:#ff8a96;white-space:nowrap}
.hd{padding:0 12px 12px}
.hd p{margin:0 0 8px;color:var(--cream);font-weight:700}
.sumtop{text-align:center;margin:18px 0 14px;padding:18px 14px;border-radius:24px}
.sumtop.anim{animation:popin .5s cubic-bezier(.2,.9,.3,1.3) both}
.sumtop.red{background:var(--red);color:#fff}
.sumtop.green{background:var(--green);color:var(--ink)}
.sumtop .n{font-size:64px;line-height:1}
.sumtop .t{font:400 clamp(22px,7vw,30px)/1.15 "Bowlby One";overflow-wrap:anywhere}
.sumtop small{display:block;margin-top:6px;font-weight:700;opacity:.85}
.pz-list{display:grid;gap:8px;margin-bottom:14px}
.pz-row{display:flex;align-items:center;gap:12px;background:var(--red);color:#fff;border-radius:18px;padding:10px 14px;min-height:64px}
.pz-row .nm{flex:1;min-width:0;font:400 19px "Bowlby One";overflow-wrap:anywhere}
.pz-row .n{font-size:30px}
/* iconen */
.ic{display:inline-block;width:1.35em;height:1.35em;object-fit:contain;vertical-align:-.32em;flex:0 0 auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.pill{display:inline-flex;align-items:center;gap:6px}
.pill .ic{width:22px;height:22px;margin:-4px 0 -4px -4px}
.mode .e{width:54px;display:flex;justify-content:center;flex:0 0 auto}
.mode .e .ic{width:48px;height:48px}
.mode.on .e .ic{animation:wob 1.6s ease-in-out infinite}
.tog .ic{width:28px;height:28px;margin-right:4px;vertical-align:-8px}
.btn .ic{width:28px;height:28px}
.bigopt .ic{width:34px;height:34px;vertical-align:-8px;margin-right:4px}
.me .big .ic{width:60px;height:60px;vertical-align:middle}
.sumtop .n .ic{width:78px;height:78px;vertical-align:middle}
.sumtop.red .n .ic{width:56px;height:56px;margin-right:4px;vertical-align:-6px}
.hub .ic{width:72%;height:72%}
.mine .ic{width:26px;height:26px}
.kcrown .ic{width:72px;height:72px}
.crown .ic{width:96px;height:96px}
.award .ae .ic{width:36px;height:36px}
.empty .ic,.pending .ic{width:24px;height:24px}
.hs .ic{width:18px;height:18px;vertical-align:-3px}
.turn .ic{width:28px;height:28px}
.sndbtn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:12px;background:var(--card);padding:0;flex:0 0 auto}
.sndbtn .ic{width:28px;height:28px}
.logo{position:relative}
.logo .fl{position:absolute;width:clamp(34px,11vw,50px);height:auto;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.logo .f1{left:0;top:8%;transform:rotate(-12deg);animation-delay:-.4s}
.logo .f2{right:0;top:14%;animation-delay:-1.3s}
.logo .f3{left:3%;bottom:2%;animation-delay:-2s}
.logo .f4{right:4%;bottom:0;animation-delay:-.9s}
.logo img.lg{animation:breathe 4.5s ease-in-out infinite}

/* animaties */
@keyframes wob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) scale(1.07)}}
@keyframes bob{0%,100%{translate:0 0;rotate:-6deg}50%{translate:0 -10px;rotate:6deg}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025) rotate(-.6deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popin{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-9px) rotate(-1.2deg)}35%{transform:translateX(8px) rotate(1deg)}55%{transform:translateX(-6px)}75%{transform:translateX(4px)}}
@keyframes flipin{0%{transform:perspective(500px) rotateY(90deg) scale(1.15)}70%{transform:perspective(500px) rotateY(-8deg) scale(1.05)}100%{transform:none}}
@keyframes glow{0%,100%{box-shadow:0 5px 0 #c9b98f,0 0 0 0 rgba(255,244,214,.55)}50%{box-shadow:0 5px 0 #c9b98f,0 0 0 12px rgba(255,244,214,0)}}
@keyframes urg{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}
@keyframes up{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,8px) scale(1.15)}100%{opacity:0;transform:translate(-50%,90px) scale(1)}}
@keyframes flash{from{opacity:1}to{opacity:0}}
#app.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.04s}#app.enter>*:nth-child(3){animation-delay:.08s}#app.enter>*:nth-child(4){animation-delay:.12s}#app.enter>*:nth-child(5){animation-delay:.16s}#app.enter>*:nth-child(6){animation-delay:.2s}#app.enter>*:nth-child(n+7){animation-delay:.24s}
#app.enter :is(.dl,.pz-list,.etab,.awards,.chips,.tiles,.pgrid,.modes,.givegrid)>*{animation:popin .45s cubic-bezier(.2,.9,.3,1.3) both}
#app.enter :is(.dl,.pz-list,.etab,.awards,.chips,.tiles,.pgrid,.modes,.givegrid)>*:nth-child(2){animation-delay:.07s}
#app.enter :is(.dl,.pz-list,.etab,.awards,.chips,.tiles,.pgrid,.modes,.givegrid)>*:nth-child(3){animation-delay:.14s}
#app.enter :is(.dl,.pz-list,.etab,.awards,.chips,.tiles,.pgrid,.modes,.givegrid)>*:nth-child(4){animation-delay:.21s}
#app.enter :is(.dl,.pz-list,.etab,.awards,.chips,.tiles,.pgrid,.modes,.givegrid)>*:nth-child(n+5){animation-delay:.28s}
#app.enter :is(.me,.sumtop,.king,.dare) .ic,#app.enter .crown .ic{animation:popin .6s .15s cubic-bezier(.2,.9,.3,1.5) both}
#app.hit{animation:shake .5s}
.pc.anim{animation:flipin .6s cubic-bezier(.2,.8,.3,1.2) both}
.chip.anim{animation:popin .5s cubic-bezier(.2,.9,.3,1.4) both}
.kcrown .ic,.crown .ic{animation:bob 2.4s ease-in-out infinite}
.btn.pulse{animation:glow 1.8s ease-in-out infinite}
.tnum.urgent{color:var(--red);animation:urg .5s ease-in-out infinite}
.tbar i.urgent{background:var(--red)}
.tapbtn.go{animation:popin .3s ease-out,glowg 1s .3s ease-in-out infinite}
@keyframes glowg{0%,100%{box-shadow:0 10px 0 #157a47,0 0 0 0 rgba(61,220,132,.6)}50%{box-shadow:0 10px 0 #157a47,0 0 0 22px rgba(61,220,132,0)}}
.cf{position:fixed;top:-40px;width:10px;height:16px;border-radius:3px;z-index:25;pointer-events:none;animation:fall var(--t) cubic-bezier(.3,.6,.5,1) forwards}
img.cf{width:34px;height:34px;border-radius:0}
.bub{position:fixed;z-index:26;pointer-events:none;font:400 30px "Bowlby One";color:#ff6b7a;text-shadow:0 3px 0 rgba(0,0,0,.4);white-space:nowrap;animation:up 1.3s ease-out forwards;display:flex;align-items:center;gap:4px}
.bub .ic{width:34px;height:34px}
.flash{position:fixed;inset:0;z-index:24;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(255,77,94,0) 30%,rgba(255,77,94,.55));animation:flash .7s ease-out forwards}
@media (prefers-reduced-motion: reduce){#app.enter>*,#app.enter *,.logo .fl,.logo img.lg,.mode.on .e .ic,.kcrown .ic,.crown .ic,.btn.pulse,.tnum.urgent{animation:none!important}#app.hit{animation:none}.cf,.flash{display:none}}
/* minigames */
.numgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.numgrid button{min-height:58px;border:0;border-radius:14px;background:var(--card2);font:400 22px "Bowlby One";color:var(--txt);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s}
.numgrid button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35);background:var(--cream);color:var(--ink)}
.bigreveal{text-align:center;margin:14px 0 6px}
.bigreveal small{display:block;color:var(--mute);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.bigreveal .n{font-size:96px;line-height:1.05;color:var(--yellow);text-shadow:0 6px 0 rgba(0,0,0,.35);animation:popin .6s cubic-bezier(.2,.9,.3,1.5) both}
.inrow{display:flex;gap:8px;margin:10px 0 6px}
.inrow .inp{margin:0;flex:1;min-width:0}
.inrow .btn{width:58px;flex:0 0 58px;padding:0}
.wordgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.word{background:var(--cream);color:var(--ink);border-radius:14px;min-height:54px;display:flex;align-items:center;justify-content:center;font:400 19px "Bowlby One";padding:6px;text-align:center;overflow-wrap:anywhere;animation:popin .4s both}
.emo{font-size:clamp(54px,17vw,84px);text-align:center;letter-spacing:.06em;margin:14px 0 8px;line-height:1.25;animation:popin .5s cubic-bezier(.2,.9,.3,1.4) both}
.bigword{background:var(--red);color:#fff;border-radius:22px;padding:18px;text-align:center;font:400 clamp(28px,9vw,42px)/1.15 "Bowlby One";margin:10px 0 12px;overflow-wrap:anywhere;box-shadow:0 6px 0 #a62635}
.bigword .ic{width:1em;height:1em;vertical-align:-.12em}
.bigword.cream{background:var(--cream);color:var(--ink);box-shadow:0 6px 0 #c9b98f}
.hints{display:grid;gap:8px;margin:12px 0}
.hint-c{background:var(--card);border-radius:16px;padding:12px 14px;font-weight:700;display:flex;gap:12px;align-items:flex-start;line-height:1.35}
.hint-c b{font:400 17px "Bowlby One";color:var(--yellow);min-width:20px}
.hint-c.anim{animation:popin .45s cubic-bezier(.2,.9,.3,1.4) both;box-shadow:inset 0 0 0 2px var(--yellow)}
.used{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.used span,.tagx{background:var(--card2);border:0;border-radius:99px;padding:7px 12px;font:700 15px Figtree,sans-serif;color:var(--txt)}
.used small{color:var(--mute);font-weight:600}
.used span.okg{background:var(--green);color:var(--ink)}
.used span.okg small{color:var(--ink)}
.tagx{background:var(--cream);color:var(--ink);min-height:40px}
.rps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rps button{min-height:116px;border:0;border-radius:20px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:800 16px Figtree,sans-serif;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .1s}
.rps button:active{transform:translateY(3px) scale(.97)}
.rps button span{font-size:46px;line-height:1}
.rpsrev{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:14px 0}
.rpsrev div{background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;font-weight:800;font-size:14px;animation:flipin .55s both;overflow-wrap:anywhere}
.rpsrev div span{display:block;font-size:42px;margin-bottom:4px}
.rpsrev div.out{background:rgba(255,77,94,.22);box-shadow:inset 0 0 0 2px var(--red)}
.fact{background:var(--cream);color:var(--ink);border-radius:24px;padding:20px 18px;margin:14px 0;font:400 clamp(20px,5.8vw,26px)/1.28 "Bowlby One";box-shadow:0 6px 0 #c9b98f;overflow-wrap:anywhere}
.verdict{border-radius:20px;padding:14px;text-align:center;font:400 clamp(24px,7vw,30px) "Bowlby One";margin:10px 0;animation:popin .5s cubic-bezier(.2,.9,.3,1.4) both;overflow-wrap:anywhere}
.verdict.t{background:var(--green);color:var(--ink)}
.verdict.f{background:var(--red);color:#fff}
.cdown{width:min(60vw,240px);aspect-ratio:1/1;border-radius:50%;margin:30px auto 16px;display:flex;align-items:center;justify-content:center;background:var(--card2);box-shadow:0 0 0 8px rgba(255,244,214,.08);font:400 110px/1 "Bowlby One";color:var(--cream)}
.cdown span{animation:urg 1s ease-in-out infinite}
.waitpad{min-height:46vh;border-radius:26px;background:#24182e;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font:400 26px "Bowlby One";color:var(--mute);margin-top:16px;touch-action:manipulation;-webkit-user-select:none;user-select:none;padding:20px}
.react{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;font:400 clamp(64px,22vw,120px) "Bowlby One";color:#16121f;touch-action:manipulation;-webkit-user-select:none;user-select:none;animation:flash .1s reverse}
.err .ic{width:22px;height:22px}

/* menu */
#menu:empty{display:none}
.sheetbg{position:fixed;inset:0;z-index:40;background:rgba(10,8,16,.62);display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:26px 26px 0 0;padding:18px var(--sr) calc(18px + env(safe-area-inset-bottom)) var(--sl);display:grid;gap:8px;animation:slideup .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet h3{margin:0 0 4px}
.sheet .btn{justify-content:flex-start;background:var(--card2)}
.sheet .btn.ghost{justify-content:center;background:transparent}
@keyframes slideup{from{transform:translateY(100%)}}
@keyframes fadein{from{opacity:0}}
.btn.sq{width:58px;flex:0 0 58px;padding:0}

/* Wel of Niet – Spice Edition */
body.spice{background:radial-gradient(120% 60% at 0% -10%,rgba(255,77,94,.30),transparent 55%),radial-gradient(90% 60% at 110% 20%,rgba(255,138,36,.22),transparent 60%),radial-gradient(100% 60% at 50% 115%,rgba(150,30,110,.42),transparent 60%),#150b1e;background-attachment:fixed}
body.spice #top{background:rgba(21,11,30,.86)}
body.spice .pill{background:rgba(255,77,94,.18);box-shadow:inset 0 0 0 1px rgba(255,138,36,.35)}
body.spice .tbar i{background:linear-gradient(90deg,#ff8a24,#ff4d5e)}
.wofq{background:linear-gradient(150deg,#3d1838,#271233);border:2px solid rgba(255,138,36,.45);border-radius:28px;padding:28px 20px;margin:18px 0;text-align:center;font:400 clamp(23px,6.8vw,31px)/1.25 "Bowlby One";box-shadow:0 20px 40px rgba(0,0,0,.35),0 0 50px rgba(255,77,94,.16);overflow-wrap:anywhere}
.wofq.small{font-size:clamp(17px,5vw,21px);padding:16px;margin:12px 0}
.wofq .tagl{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,#ff4d5e,#ff8a24);color:#fff;border-radius:99px;padding:5px 12px 5px 8px;font:800 13px Figtree,sans-serif;margin-bottom:14px;letter-spacing:.04em}
.wofq .tagl .ic{width:20px;height:20px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn button{min-height:124px;border:0;border-radius:24px;font:400 36px "Bowlby One";color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.2,.9,.3,1.4),opacity .3s,filter .3s}
.yn button:active{transform:translateY(4px) scale(.97)}
.yn .ja{background:linear-gradient(160deg,#ff9a3c,#ff4d5e)}
.yn .nee{background:linear-gradient(160deg,#7b4be0,#3d2280)}
.yn button.sel{transform:scale(1.05);box-shadow:0 0 0 4px var(--cream),0 0 30px rgba(255,138,36,.5),0 7px 0 rgba(0,0,0,.4);animation:popin .4s cubic-bezier(.2,.9,.3,1.5)}
.yn button.dim{opacity:.28;filter:grayscale(.7);transform:scale(.94)}
.reveal-c{text-align:center;padding:24px 0}
.reveal-c .cd{font-size:130px;line-height:1;color:#ff8a24;text-shadow:0 0 40px rgba(255,138,36,.65);animation:urg .5s ease-in-out infinite}
.reveal-c .cd.urgent{color:#ff8a24}
.splitlbl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}
.split{display:flex;height:66px;border-radius:20px;overflow:hidden;margin:10px 0 8px;font:400 22px "Bowlby One";background:var(--card)}
.split div{display:flex;align-items:center;justify-content:center;color:#fff;min-width:0;animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
.split .nee{transform-origin:right}
.split .none{flex:1;color:var(--mute);font-size:16px}
@keyframes grow{from{transform:scaleX(0)}}
.split .ja{background:linear-gradient(90deg,#ff9a3c,#ff4d5e)}
.split .nee{background:linear-gradient(90deg,#3d2280,#7b4be0)}
.minor{display:inline-block;background:var(--red);color:#fff;border-radius:99px;padding:3px 10px;font:800 11px Figtree,sans-serif;font-style:normal;letter-spacing:.08em;animation:urg 1s ease-in-out infinite}
.votes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.vote{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:8px 10px;font-weight:800;min-width:0;animation:flipin .55s both}
.vote span{min-width:0;overflow-wrap:anywhere}
.vote b{margin-left:auto;font:400 16px "Bowlby One"}
.vote.ja b{color:#ff9a3c}
.vote.nee b{color:#a98bff}
.vote.min{box-shadow:inset 0 0 0 2px var(--red);background:rgba(255,77,94,.14)}
@media (prefers-reduced-motion: reduce){.reveal-c .cd,.minor,.cdown span{animation:none}}
/* Doen of Waarheid */
#app{position:relative;z-index:1}
.dowhead{text-align:center;background:linear-gradient(150deg,#33284a,#221b30);border-radius:24px;padding:18px 14px;margin:6px 0 10px;box-shadow:inset 0 0 0 1px rgba(255,244,214,.08)}
.dowhead .disp{font-size:clamp(26px,8vw,34px);color:var(--cream);line-height:1.1}
.dowhead p{margin:6px 0 0;color:var(--mute);font-weight:700}
.dowmodes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dowmode{position:relative;text-align:left;border:2px solid transparent;border-radius:20px;padding:14px;min-height:150px;display:flex;flex-direction:column;gap:8px;color:var(--txt);transition:transform .2s,border-color .2s}
.dowmode b{font:400 20px "Bowlby One"}
.dowmode small{font-weight:600;font-size:13.5px;line-height:1.35}
.dowmode.normaal{background:linear-gradient(160deg,#3a2d55,#2a2140)}
.dowmode.normaal small{color:#d9cdf0}
.dowmode.spicy{background:linear-gradient(160deg,#5a1433,#2a0f2e 60%,#1a0a1f)}
.dowmode.spicy small{color:#ffc2b0}
.dowmode.on{border-color:var(--cream);transform:scale(1.02)}
.dowmode.spicy.on{border-color:#ff8a24;animation:spglow 2s ease-in-out infinite}

.age{position:absolute;top:10px;right:10px;background:#ff4d5e;color:#fff;font:800 11px Figtree,sans-serif;border-radius:99px;padding:3px 8px;font-style:normal}
.dowturn{text-align:center;margin:22px 0 16px}
.dowturn .disp{font-size:clamp(24px,7vw,30px);margin-top:12px;overflow-wrap:anywhere}
.dowturn .av{animation:popin .5s cubic-bezier(.2,.9,.3,1.4) both;box-shadow:0 0 0 4px var(--cream),0 0 30px rgba(255,244,214,.25)}
.dowpick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dowbtn{min-height:136px;border:0;border-radius:24px;font:400 clamp(19px,5.6vw,25px) "Bowlby One";color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.dowbtn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.4)}
.dowbtn.doen{background:linear-gradient(160deg,#ff9a3c,#ff4d5e)}
.dowbtn.waar{background:linear-gradient(160deg,#7b4be0,#3d2280)}
.dowbtn[disabled]{opacity:.35;filter:grayscale(.8)}
.dowbtn .ic{width:40px;height:40px}
.lockmsg{background:rgba(255,201,60,.14);color:var(--yellow);border-radius:14px;padding:10px 12px;font-weight:700;margin-top:12px;display:flex;gap:10px;align-items:center}
.lockmsg .ic{width:26px;height:26px}
.slot{margin:18px 0 10px;text-align:center}
.slot-win{height:72px;overflow:hidden;border-radius:20px;background:var(--cream);box-shadow:0 0 0 4px var(--yellow),0 10px 30px rgba(0,0,0,.4)}
.reel{animation:reel 2.6s cubic-bezier(.12,.75,.2,1) forwards}

.si{height:72px;display:flex;align-items:center;justify-content:center;gap:10px;font:400 24px "Bowlby One";color:var(--ink);padding:0 10px;overflow:hidden;white-space:nowrap}
.slot p{color:var(--mute);font-weight:700}
.dowcard{position:relative;border-radius:28px;padding:20px 18px 24px;margin:16px 0;background:var(--cream);color:var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.4);overflow:hidden}
.dowcard.anim{animation:flipin .65s cubic-bezier(.2,.8,.3,1.2) both}
.dowcard.spicy{background:linear-gradient(150deg,#45123a,#24102f);color:#fff;border:2px solid rgba(255,138,36,.5);box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 50px rgba(255,77,94,.28)}
.dc-kind{display:inline-block;border-radius:99px;padding:6px 14px;font:400 15px "Bowlby One";letter-spacing:.06em;color:#fff}
.dowcard.doen .dc-kind{background:linear-gradient(90deg,#ff9a3c,#ff4d5e)}
.dowcard.waarheid .dc-kind{background:linear-gradient(90deg,#7b4be0,#3d2280)}

.dc-who .av{width:32px;height:32px;font-size:15px}
.dc-with{opacity:.7;font-weight:700}
.dc-q{font:400 clamp(20px,5.8vw,26px)/1.3 "Bowlby One";margin-top:12px;overflow-wrap:anywhere}
.stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);border:5px solid #ff4d5e;color:#ff4d5e;border-radius:14px;padding:6px 14px;font:400 clamp(24px,8vw,34px) "Bowlby One";background:rgba(255,255,255,.9);animation:stamp .45s cubic-bezier(.2,.9,.3,1.5) both;white-space:nowrap}

@keyframes kissup{0%{transform:translateY(0) rotate(-12deg) scale(.8);opacity:0}12%{opacity:.5}50%{transform:translateY(-55vh) rotate(14deg) scale(1)}88%{opacity:.4}100%{transform:translateY(-118vh) rotate(-10deg) scale(1.1);opacity:0}}
@media (prefers-reduced-motion: reduce){#kiss span{animation:none;opacity:.18;bottom:var(--b)}.dowmode.spicy.on,.reel{animation:none}.reel{transform:translateY(var(--to))}}
