<script>
(function(){
'use strict';

/* ================= Basis ================= */
const MV = window.SLOKKIE_MINI || {categorie:[],verboden:[],wieBenIk:[],geheugen:[],emoji:[],waarNiet:[],welOfNiet:[]};
const V = window.SLOKKIE_VRAGEN || {quiz:[],likely:[],never:[],thisorthat:[],rad:{flirt:[],drama:[]}};
const params = new URLSearchParams(location.search);
const LOCAL = params.get('net') === 'local';
const PREFIX = 'slokkie-v1-';
const LETTERS = 'ABCDEFGHJKMNPQRSTUVWXYZ'; // zonder I, L en O
const COLORS = ['#ff5d73','#4cc9f0','#ffd23f','#7bd389','#c77dff','#ff9f1c','#f78fd0','#64dfdf','#b5e48c','#ff8c69','#a0c4ff','#e9c46a','#d0a8ff','#90e0ef'];
const SS = (()=>{ try{ return LOCAL ? window.sessionStorage : window.localStorage; }catch(e){ return null; } })();
const store = {
  get(k,d){ try{ const v = SS.getItem('slokkie-'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ SS.setItem('slokkie-'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ SS.removeItem('slokkie-'+k); }catch(e){} }
};
const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2,'0')).join('');
/* ---------- profielen (alleen op dit toestel) ---------- */
const profiles = () => store.get('profiles', {});
const saveProfiles = ps => store.set('profiles', ps);
let PROF = null;           // ingelogd profiel
let TOKEN = null;          // vast token van het profiel, voor terugkomen in een spel
const hex = buf => Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2,'0')).join('');
async function hashPw(pw, salt){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(salt), iterations:120000, hash:'SHA-256'}, key, 256));
}
function setProfile(p){
  PROF = p || null;
  TOKEN = p ? p.token : null;
  me.name = p ? p.name : ''; me.gender = p ? (p.gender || '') : ''; me.drive = p ? !!p.drive : false; me.avatar = p ? (p.avatar || '') : '';
  if(p) store.set('session', p.id); else store.del('session');
}
function updateProfile(fn){
  if(!PROF) return;
  const ps = profiles(); const p = ps[PROF.id]; if(!p) return;
  fn(p); saveProfiles(ps); PROF = p;
  me.name = p.name; me.gender = p.gender || ''; me.drive = !!p.drive; me.avatar = p.avatar || '';
}
function fileToAvatar(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
      const m = Math.min(img.naturalWidth, img.naturalHeight);
      c.getContext('2d').drawImage(img, (img.naturalWidth-m)/2, (img.naturalHeight-m)/2, m, m, 0, 0, s, s);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Kon de foto niet lezen')); };
    img.src = url;
  });
}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const genCode = () => Array.from({length:4}, () => pick(LETTERS)).join('');
const sl = n => n===1 ? 'slok' : 'slokken';
const secs = ms => (ms/1000).toFixed(2).replace('.',',')+' s';

const me = { name:'', drive:false, avatar:'' };
let AVS = {};   // profielfoto's per speler-id (los van de spelstand verstuurd)
let role = null;      // 'host' | 'player' | null
let S = null;         // spelstand
let myId = null;
let offset = 0;       // hosttijd - eigen tijd
let netOk = false;
const ui = { err:'', joinCode:(params.get('code')||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4), code:'', sent:null, val:{}, mem:{}, menu:false, verbPick:null };
const hnow = () => Date.now() + offset;

const P = id => S && S.players.find(p => p.id===id);
const nm = id => { const p = P(id); return p ? p.name : '?'; };
const ini = n => esc(((n||'?').trim().charAt(0) || '?').toUpperCase());
const av = (id, cls='') => {
  const p = P(id), src = AVS[id];
  if(src && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(src)) return `<img class="av ${cls}" alt="" src="${src}" style="border-color:${p?p.color:'#777'}">`;
  return `<i class="av ${cls}" style="background:${p?p.color:'#777'}">${ini(p?p.name:'?')}</i>`;
};
const DRV = '🚗';
const ic = (n, cls='') => `<img class="ic ${cls}" src="img/${n}.webp" alt="" draggable="false">`;
// rijmodus: alcoholvrij, max 4 slokken per ronde (max 10 in totaal bij Bussen)
function capLeft(id){
  const p = P(id); if(!p || !p.drive) return Infinity;
  if(S.mode==='bus') return Math.max(0, 10 - p.drunk);
  return Math.max(0, 4 - ((S.cur && S.cur[id]) || 0));
}

const TYPES = {
  quiz:  {l:'Quiz', e:ic('question')},
  likely:{l:'Wie is het meest waarschijnlijk', e:ic('target')},
  never: {l:'Ik heb nog nooit', e:ic('thumbdown')},
  tot:   {l:'Dit of dat', e:ic('shuffle')},
  tap:   {l:'Tik-race', e:ic('stopwatch')},
  wheel: {l:'Slokkenrad', e:ic('dice')}
};
const MODES = {
  classic:{l:'Slokkie', d:'Kahoot-rondes: quiz, stemmen, tik-race en meer', e:ic('cheers')},
  mini:   {l:'Minigames', d:'10 partyspellen: reactie, raden, geheugen en meer', e:ic('star')},
  wof:    {l:'Wel of Niet 🔥', d:'Durf jij eerlijk antwoord te geven?', e:ic('fire')},
  dow:    {l:'Doen of Waarheid', d:'Hoe goed durf jij je vrienden écht te leren kennen?', e:ic('target')},
  rad:    {l:'Het Rad', d:'Het oude spel van Jesse: 100 flirt- en drama-opdrachten', e:ic('refresh')},
  bus:    {l:'Bussen', d:'Het kaartspel: 4 vragen, de piramide en de bus', e:ic('cards')}
};
const MINI = {
  snel:  {l:'Snelste vinger', e:ic('stopwatch'), d:'Wie het langzaamst tikt, verliest'},
  getal: {l:'Raad het getal', e:ic('dice'), d:'Wie er het verst naast zit, verliest'},
  cat:   {l:'Categorie-race', e:ic('flag'), d:'Om de beurt iets noemen binnen een categorie'},
  verb:  {l:'Verboden woord', e:ic('mute'), d:'Wie het woord zegt, verliest'},
  wbi:   {l:'Wie ben ik?', e:ic('question'), d:'Raad de bekende persoon met zo min mogelijk hints'},
  mem:   {l:'Geheugentest', e:ic('info'), d:'Onthoud 10 woorden in 15 seconden'},
  emo:   {l:'Emoji-raadsel', e:ic('party'), d:'Films, series, personen, plaatsen en liedjes'},
  rps:   {l:'Steen-papier-schaar', e:ic('shuffle'), d:'Tot er één winnaar overblijft'},
  wnw:   {l:'Waar of niet waar', e:ic('check'), d:'Feitjes raden, met scorebord'},
  react: {l:'Reactietest', e:ic('gauge'), d:'Tik zodra het scherm van kleur verandert'}
};
const WOF = {l:'Wel of Niet', e:ic('fire')};
const allMini = () => Object.fromEntries(Object.keys(MINI).map(k => [k,1]));
const BUSQ = [
  {t:'Rood of zwart?', o:['Rood','Zwart'], c:['o-red','o-black'], h:'Gok de kleur van je eerste kaart.'},
  {t:'Hoger of lager?', o:['Hoger','Lager'], c:['o-org','o-blue'], h:'Dan je eerste kaart. Gelijk is fout.'},
  {t:'Binnen of buiten?', o:['Binnen','Buiten'], c:['o-org','o-blue'], h:'Ten opzichte van je eerste twee kaarten. Gelijk is fout.'},
  {t:'Heb je de soort al?', o:['Heb ik al','Heb ik nog niet'], c:['o-green','o-red'], h:'Harten, ruiten, schoppen of klaveren.'}
];
const SHAPES = [
  '<svg viewBox="0 0 24 24"><path d="M12 3 22.5 20.5H1.5z"/></svg>',
  '<svg viewBox="0 0 24 24"><path d="M12 1.5 22.5 12 12 22.5 1.5 12z"/></svg>',
  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>',
  '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>'
];

/* kaarten: 'H10' = harten 10, waarde 2..14 (14 = aas) */
const SYM = {H:'♥',D:'♦',S:'♠',C:'♣'};
const cv = c => +c.slice(1), cs = c => c[0];
const isRed = c => cs(c)==='H' || cs(c)==='D';
const VAL = v => ({11:'J',12:'Q',13:'K',14:'A'})[v] || String(v);
const newDeck = (n=1) => { const d=[]; for(let k=0;k<n;k++) for(const s of 'HDSC') for(let v=2;v<=14;v++) d.push(s+v); return shuffle(d); };
const cardHtml = (c, cls='', ak='') => { const A = ak ? ` data-anim="${ak}"` : '';
  if(!c) return `<div class="pc back ${cls}"${A}></div>`;
  const v = VAL(cv(c)), y = SYM[cs(c)], ci = `<i class="ci">${v}<small>${y}</small></i>`;
  return `<div class="pc ${isRed(c)?'r':''} ${cv(c)>10 && cv(c)<14 ? 'face' : ''} ${cls}"${A}>${ci}<b>${v}</b><span>${y}</span>${ci.replace('ci','ci br')}</div>`; };
const cardName = c => `${VAL(cv(c))}${SYM[cs(c)]}`;

const sip = n => { const i = S && S.set ? S.set.intensity : 'normal'; return i==='rustig' ? Math.max(1, Math.round(n/2)) : i==='pittig' ? n+1 : n; };

/* geluidjes (WebAudio, geen bestanden) */
const SND = { on: store.get('sound', true), ctx: null };
function ac(){
  if(!SND.ctx){ try{ SND.ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
  if(SND.ctx.state==='suspended') SND.ctx.resume().catch(() => {});
  return SND.ctx;
}
document.addEventListener('pointerdown', () => { if(SND.on) ac(); }, {passive:true});
function tone(f, at, d, type, v, f2){
  const c = SND.ctx, t = c.currentTime + at;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || .15, t + .015); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .05);
}
const SFX = {
  reveal(){ [392,494,587,784].forEach((f,i) => tone(f, i*.06, .5, 'sawtooth', .07)); tone(1568, .2, .5, 'sine', .1); },
  round(){ [523,659,784].forEach((f,i) => tone(f, i*.07, .2, 'triangle', .13)); },
  drink(){ tone(240, 0, .38, 'sawtooth', .1, 110); tone(180, .1, .42, 'square', .05, 80); },
  safe(){ tone(784, 0, .14, 'sine', .14); tone(1175, .1, .3, 'sine', .14); },
  give(){ tone(988, 0, .08, 'triangle', .11); tone(1319, .06, .16, 'triangle', .1); },
  go(){ tone(880, 0, .25, 'square', .1); tone(1320, 0, .25, 'sine', .08); },
  tick(){ tone(1400, 0, .05, 'square', .04); },
  join(){ tone(660, 0, .1, 'sine', .12); tone(990, .08, .16, 'sine', .12); },
  flip(){ tone(1600, 0, .05, 'triangle', .06, 700); },
  win(){ [523,659,784,1047,880,1047,1319].forEach((f,i) => tone(f, i*.1, .24, 'triangle', .13)); }
};
function sfx(k){ if(!SND.on) return; const c = ac(); if(!c || c.state!=='running') return; try{ SFX[k](); }catch(e){} }

const CF = ['beer','star','party','cheers','shots','crown'];
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for(let i=0;i<n;i++){
    const img = i % 3 === 0, e = document.createElement(img ? 'img' : 'i');
    if(img){ e.src = 'img/'+pick(CF)+'.webp'; e.alt = ''; } else e.style.background = pick(COLORS);
    e.className = 'cf';
    e.style.left = (Math.random()*100)+'vw';
    e.style.setProperty('--x', (Math.random()*180-90)+'px');
    e.style.setProperty('--r', (Math.random()*900-450)+'deg');
    e.style.setProperty('--t', (1.8+Math.random()*1.6)+'s');
    e.style.animationDelay = (Math.random()*.5)+'s';
    document.body.appendChild(e); setTimeout(() => e.remove(), 4200);
  }
}
function hit(n){
  const a = $('#app'); a.classList.remove('hit'); void a.offsetWidth; a.classList.add('hit'); setTimeout(() => a.classList.remove('hit'), 550);
  const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f); setTimeout(() => f.remove(), 750);
  const m = $('.mine');
  if(m){ const r = m.getBoundingClientRect(), b = document.createElement('div'); b.className = 'bub'; b.innerHTML = '+'+n+' '+ic('beer');
    b.style.left = Math.min(innerWidth-50, r.left + r.width/2)+'px'; b.style.top = r.bottom+'px'; document.body.appendChild(b); setTimeout(() => b.remove(), 1400); }
}
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'), 2600); }

/* ================= Host: netwerk ================= */
const H = { tokens:{}, decks:{}, conns:new Map(), lconns:{}, mconns:{}, mq:[], seen:{}, peer:null, chan:null, loop:null, fresh:false, lastPush:0, restartT:null };

/* Relay via MQTT over WebSocket: werkt ook als WebRTC niet door de NAT komt (4G vs wifi).
   Spelers verbinden via PeerJS én de relay; wat het eerst werkt, wordt gebruikt. */
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const TOP = code => 'slokkie/v1/' + code;
const MQOPT = () => ({clientId:'slk-'+rid(6), reconnectPeriod:2500, connectTimeout:8000, keepalive:30, clean:true});
function hostNetState(){
  netOk = LOCAL || !!(H.peer && H.peer.open) || H.mq.some(c => c.connected);
  render();
}
function hostRelay(){
  hostRelayStop();
  if(LOCAL || typeof mqtt==='undefined' || !S) return;
  const code = S.code;
  H.mq = BROKERS.map((url, bi) => {
    const c = mqtt.connect(url, MQOPT());
    c.on('connect', () => { c.subscribe(TOP(code)+'/h'); hostNetState(); });
    c.on('close', hostNetState);
    c.on('error', () => {});
    c.on('message', (t, buf) => {
      let d; try{ d = JSON.parse(buf.toString()); }catch(e){ return; }
      if(!d || !d.from || !d.m) return;
      const key = bi+':'+d.from;
      const conn = H.mconns[key] || (H.mconns[key] = { open:true, send: m => { try{ if(c.connected) c.publish(TOP(code)+'/c/'+d.from, JSON.stringify(m)); }catch(e){} } });
      hostMsg(conn, d.m);
    });
    return c;
  });
}
function hostRelayStop(){
  H.mq.forEach(c => { try{ c.end(true); }catch(e){} });
  H.mq = []; H.mconns = {};
}

function hostNet(){
  if(LOCAL){
    if(H.chan) H.chan.close();
    H.chan = new BroadcastChannel('slokkie-local-'+S.code);
    H.chan.onmessage = e => {
      const d = e.data; if(!d || d.to!=='host') return;
      const conn = H.lconns[d.from] || (H.lconns[d.from] = { open:true, send: m => H.chan && H.chan.postMessage({to:d.from, m}) });
      hostMsg(conn, d.m);
    };
    netOk = true; render(); return;
  }
  if(typeof Peer !== 'function'){ hostNetState(); hostRestart(3000); return; }
  const peer = H.peer = new Peer(PREFIX+S.code, {debug:1});
  peer.on('open', () => { if(H.peer!==peer) return; H.fresh = false; hostNetState(); });
  peer.on('connection', conn => {
    conn.on('data', d => hostMsg(conn, d));
    conn.on('close', () => { if(conn._pid && H.conns.get(conn._pid)===conn) H.conns.delete(conn._pid); });
    conn.on('error', () => {});
  });
  peer.on('disconnected', () => {
    if(H.peer!==peer || peer.destroyed) return;
    hostNetState();
    setTimeout(() => { try{ if(H.peer===peer && !peer.destroyed && peer.disconnected) peer.reconnect(); }catch(e){ hostRestart(2000); } }, 1500);
  });
  peer.on('error', err => {
    if(H.peer!==peer) return;
    if(err.type==='peer-unavailable') return;
    hostNetState();
    if(err.type==='unavailable-id'){
      // code bezet: bij een gloednieuw spel een nieuwe code kiezen, anders (herladen) blijven proberen
      if(H.fresh && S.phase==='lobby' && S.players.length<=1){ S.code = genCode(); push(); hostRelay(); hostRestart(100); }
      else hostRestart(3000);
      return;
    }
    if(['network','server-error','socket-error','socket-closed','browser-incompatible'].includes(err.type)) hostRestart(3000);
  });
}
function hostRestart(ms){
  clearTimeout(H.restartT);
  H.restartT = setTimeout(() => {
    if(role!=='host' || !S) return;
    try{ if(H.peer) H.peer.destroy(); }catch(e){}
    H.peer = null; hostNet();
  }, ms);
}
function bcast(m){
  if(LOCAL){ if(H.chan) H.chan.postMessage({to:'*', m}); return; }
  H.conns.forEach(c => { try{ if(c.open) c.send(m); }catch(e){} });
}
function sendTo(conn, m){ try{ if(conn && conn.open) conn.send(m); }catch(e){} }

function push(){
  if(role!=='host' || !S) return;
  S.seq = (S.seq||0) + 1; H.lastPush = Date.now();
  try{ store.set('host', {S, tokens:H.tokens, decks:H.decks, avs:AVS}); }catch(e){}
  store.set('last', {role:'host', code:S.code, at:Date.now(), pid:PROF && PROF.id});
  bcast({t:'state', s:S, now:Date.now()});
  onState(); render();
}
const okAvatar = s => typeof s==='string' && s.length < 60000 && /^data:image\/(jpeg|png|webp);base64,/.test(s);

function hostMsg(conn, m){
  if(!m || !m.t || !S) return;
  if(m.t==='join'){
    if(S.phase==='closed') return;
    const pid = addPlayer(m.token, m.name, m.drive, m.g);
    const newAv = okAvatar(m.av) ? m.av : null;
    const avChanged = (AVS[pid]||null) !== newAv;
    if(newAv) AVS[pid] = newAv; else delete AVS[pid];
    if(conn){ H.conns.set(pid, conn); conn._pid = pid; }
    H.seen[pid] = Date.now();
    sendTo(conn, {t:'you', id:pid});
    if(avChanged) bcast({t:'avs', a:AVS}); else sendTo(conn, {t:'avs', a:AVS});
    push(); return;
  }
  const id = H.tokens[m.token];
  if(!id || !P(id)){ sendTo(conn, {t:'who'}); return; }
  if(conn && id!==myId && H.conns.get(id)!==conn){
    // speler wisselt van verbindingsroute: meteen de stand via de nieuwe route sturen
    H.conns.set(id, conn); conn._pid = id;
    sendTo(conn, {t:'avs', a:AVS});
    sendTo(conn, {t:'state', s:S, now:Date.now()});
  }
  H.seen[id] = Date.now();
  const p = P(id);
  let changed = false;
  if(!p.on){ p.on = true; changed = true; }
  if(m.t==='ping'){ if(changed) push(); return; }
  if(m.t==='drive'){ p.drive = !!m.on; push(); return; }
  if(m.t==='gender'){ if(m.g==='boy' || m.g==='girl'){ p.g = m.g; push(); } return; }
  if(m.t==='answer'){ onAnswer(id, m); if(changed && S.phase!=='result') push(); return; }
  if(m.t==='give'){ onGive(id, m.to); return; }
  if(changed) push();
}

function uniqName(n, id){ const base=n; let k=2; while(S.players.some(p => p.id!==id && p.name.toLowerCase()===n.toLowerCase())) n = base+' '+(k++); return n; }
function addPlayer(token, name, drive, g){
  g = g==='boy' || g==='girl' ? g : '';
  name = String(name||'').trim().slice(0,16) || 'Speler';
  let id = H.tokens[token]; const p = id && P(id);
  if(p){ p.name = uniqName(name, id); p.drive = !!drive; if(g) p.g = g; p.on = true; return id; }
  id = 'p'+rid(3);
  H.tokens[token] = id;
  const color = COLORS.find(c => !S.players.some(q => q.color===c)) || COLORS[S.players.length % COLORS.length];
  S.players.push({id, name:uniqName(name,id), color, drive:!!drive, g, drunk:0, given:0, on:true});
  return id;
}

function hostLoopStart(){
  clearInterval(H.loop);
  H.loop = setInterval(() => {
    if(role!=='host' || !S) return;
    const now = Date.now(); let ch = false;
    S.players.forEach(p => {
      if(p.id===myId){ if(!p.on){ p.on=true; ch=true; } return; }
      const on = now - (H.seen[p.id]||0) < 15000;
      if(p.on!==on){ p.on = on; ch = true; }
    });
    if(S.phase==='play' && S.r){
      const r = S.r;
      if(r.type==='rad' && r.stage==='spin' && now>=r.dl){ r.stage='dare'; r.ts=now; r.dl=now+60000; push(); return; }
      const mt = MINI[r.type] ? miniTick(r, now) : r.type==='dow' ? dowTick(r, now) : 0;
      if(mt===1) return;
      if(mt===2){ if(ch || now - H.lastPush > 4000) push(); return; }
      if(r.dl && now>=r.dl && !['pyr','ride'].includes(r.type)){ endRound(); return; }
      if(ch && allIn(r)){ endRound(); return; }
    }
    if(ch || now - H.lastPush > 4000) push();
  }, 250);
}

function hostCreate(){
  S = { code:genCode(), mode:'classic', phase:'lobby',
        set:{ rounds:15, intensity:'normal', types:{quiz:1,likely:1,never:1,tot:1,tap:1,wheel:1}, rad:{flirt:1,drama:1}, mini:allMini(), dow:'normaal' },
        players:[], n:0, total:15, r:null, res:null, bus:null, seq:0 };
  H.tokens = {}; H.decks = {}; H.seen = {}; H.fresh = true; AVS = {};
  role = 'host'; offset = 0;
  myId = addPlayer(TOKEN, me.name, me.drive, me.gender);
  if(me.avatar) AVS[myId] = me.avatar;
  hostNet(); hostRelay(); hostLoopStart(); push();
}
function hostResume(saved){
  S = saved.S; if(S.set && !S.set.mini) S.set.mini = allMini(); if(S.set && !S.set.dow) S.set.dow = 'normaal'; H.tokens = saved.tokens || {}; H.decks = saved.decks || {}; H.seen = {}; H.fresh = false;
  AVS = saved.avs || {};
  role = 'host'; offset = 0;
  myId = H.tokens[TOKEN] || addPlayer(TOKEN, me.name, me.drive, me.gender);
  if(me.avatar) AVS[myId] = me.avatar;
  S.players.forEach(p => { if(p.id!==myId) p.on = false; });
  // spelers even de tijd geven om terug te komen
  if(S.phase==='play' && S.r && S.r.dl) S.r.dl = Math.max(S.r.dl, Date.now()+8000);
  const now = Date.now(); S.players.forEach(p => H.seen[p.id] = now);
  hostNet(); hostRelay(); hostLoopStart(); push();
}
function hostTeardown(){
  clearInterval(H.loop); clearTimeout(H.restartT);
  try{ if(H.peer) H.peer.destroy(); }catch(e){}
  try{ if(H.chan) H.chan.close(); }catch(e){}
  hostRelayStop(); H.peer = null; H.chan = null; H.conns.clear(); H.lconns = {};
  store.del('host'); store.del('last');
  role = null; S = null; myId = null; netOk = false; lastDrunk = null; AVS = {};
  render();
}

/* ================= Host: spelregels ================= */
const active = () => S.players.filter(p => p.on);
function draw(kind, arr){
  let d = H.decks[kind];
  if(!d || !d.length || d.some(i => i>=arr.length)) d = H.decks[kind] = shuffle([...arr.keys()]);
  return arr[d.pop()];
}
function radList(){
  const l = [];
  if(S.set.rad.flirt) (V.rad.flirt||[]).forEach((t,i) => l.push({t, c:'Flirt', nr:i+1}));
  if(S.set.rad.drama) (V.rad.drama||[]).forEach((t,i) => l.push({t, c:'Drama & chaos', nr:i+51}));
  return l;
}
/* slokken toekennen, met de limiet van de rijmodus; houdt ook de ronde-geschiedenis bij */
function addSips(id, n){
  const p = P(id); if(!p) return 0;
  n = Math.min(n, capLeft(id)); if(n<=0) return 0;
  p.drunk += n;
  S.cur = S.cur || {}; S.cur[id] = (S.cur[id]||0) + n;
  return n;
}
function drink(res, id, n, why){
  const k = addSips(id, n);
  if(k>0) res.drinks.push({id, n:k, why});
  else if(P(id) && P(id).drive && n>0) res.drinks.push({id, n:0, why:why+' (max bereikt, '+DRV+')'});
  return k;
}
function resetCur(){ S.cur = {}; S.curG = {}; S.curS = {}; S.curP = {}; }
function bucket(label, text){ archive(); S.cm = {n:S.n, label, text:text||'', note:''}; resetCur(); }
function archive(){
  if(S.cm){ S.hist = S.hist || []; S.hist.push(Object.assign({}, S.cm, {d:S.cur || {}})); }
  S.cm = null; resetCur();
}
function goEnd(){ archive(); S.phase = 'end'; push(); }
function allIn(r){
  if(!r || !['quiz','likely','never','tot','tap','bq','getal','emo','wnw','wof','mem','snel','react'].includes(r.type)) return false;
  const elig = r.ids.filter(id => { const p = P(id); return p && p.on; });
  return elig.length>0 && elig.every(id => r.ans[id]);
}

function hostStart(){
  S.players.forEach(p => { p.drunk = 0; p.given = 0; });
  S.n = 0; S.r = null; S.res = null; S.bus = null; S.last = null;
  S.hist = []; S.cm = null; resetCur(); S.gid = rid(4); S.score = {}; S.pen = {}; S.tstreak = {}; S.dowIdx = Math.floor(Math.random()*Math.max(1, S.players.length)) - 1;
  if(S.mode==='bus') busStart();
  else { S.total = S.mode==='wof' ? Math.min(S.set.rounds, MV.welOfNiet.length || 20) : S.set.rounds; nextRound(); }
}

function nextRound(){
  if(S.n >= S.total){ goEnd(); return; }
  S.n++; S.res = null;
  startRound(pickType());
}
function pickType(){
  if(S.mode==='rad') return 'rad';
  if(S.mode==='wof') return 'wof';
  if(S.mode==='dow') return 'dow';
  const mini = S.mode==='mini', src = mini ? (S.set.mini || allMini()) : S.set.types;
  let types = Object.keys(mini ? MINI : TYPES).filter(k => src[k]);
  if(!types.length) types = [mini ? 'getal' : 'quiz'];
  if(types.length>1) types = types.filter(t => t!==S.last);
  const t = pick(types); S.last = t; return t;
}
function startRound(type){
  const ids = active().map(p => p.id);
  const t0 = Date.now();
  if(type==='rad'){
    const list = radList();
    const d = draw('rad-'+(S.set.rad.flirt?'f':'')+(S.set.rad.drama?'d':''), list);
    S.r = {type:'rad', ids, ans:{}, who:pick(ids), dare:d.t, cat:d.c, nr:d.nr, n:2, stage:'spin', t0, dl:t0+4300};
    bucket('Het Rad', d.t);
    S.phase = 'play'; push(); return;
  }
  if(type==='dow'){
    const r = makeDow(ids, t0);
    bucket('Doen of Waarheid', '');
    S.r = r; S.phase = 'play'; push(); return;
  }
  if(MINI[type] || type==='wof'){
    const r = makeMini(type, ids, t0);
    bucket(modeInfo(type).l, miniText(r));
    S.r = r; S.phase = 'play'; push(); return;
  }
  const r = {type, ids, ans:{}, t0};
  if(type==='quiz'){
    const q = draw('quiz', V.quiz); const order = shuffle([0,1,2,3]);
    r.q = q[0]; r.opts = order.map(i => q[i+1]); r.ok = order.indexOf(0); r.dl = t0+20000;
  } else if(type==='likely'){ r.q = draw('likely', V.likely); r.dl = t0+20000; }
  else if(type==='never'){ r.q = draw('never', V.never); r.opts = ['Wel gedaan','Nooit gedaan']; r.dl = t0+15000; }
  else if(type==='tot'){ r.opts = draw('tot', V.thisorthat).slice(); r.dl = t0+12000; }
  else if(type==='tap'){ r.goAt = t0 + 2500 + Math.random()*3500; r.dl = r.goAt + 7000; }
  else if(type==='wheel'){ r.who = pick(ids); r.out = pick(['drink','give','buddy','all','safe']); r.dl = t0+4500; }
  const txt = type==='likely' ? `Wie is het meest waarschijnlijk om ${r.q}?` : type==='never' ? `Ik heb nog nooit ${r.q}` : type==='tot' ? `${r.opts[0]} of ${r.opts[1]}?` : (r.q || '');
  bucket(TYPES[type].l, txt);
  S.r = r; S.phase = 'play'; push();
}

function onAnswer(id, m){
  if(S.phase!=='play' || !S.r) return;
  const r = S.r;
  if(r.type==='rad'){
    if(r.stage!=='dare' || r.dec) return;
    if(id!==r.who && id!==myId) return;
    r.dec = m.v==='done' ? 'done' : 'drink';
    endRound(); return;
  }
  if(r.type==='dow'){ dowAnswer(id, m, r); return; }
  if(MINI[r.type] || r.type==='wof'){ miniAnswer(id, m, r); return; }
  if(r.type==='ride'){ if((id===S.bus.driver || id===myId)) rideAct(m.v); return; }
  if(!r.ids || !r.ids.includes(id) || r.ans[id]) return;
  if(r.type==='tap'){
    const at = Math.min(Number(m.at)||Date.now(), Date.now());
    r.ans[id] = {t:at, early: at < r.goAt};
  } else {
    let v = m.v;
    if(r.type==='likely'){ if(!P(v)) return; }
    else { v = Number(v); if(!(v>=0 && v<(r.type==='quiz'?4:2))) return; }
    r.ans[id] = {v, t:Date.now()-r.t0};
  }
  if(allIn(r)) endRound(); else push();
}

function onGive(id, to){
  const res = S.res; if(!res || !res.gives) return;
  const g = res.gives.find(g => g.id===id && g.left>0);
  if(!g || to===id || !P(to)) return;
  if(capLeft(to) <= 0) return; // rijdt nog en zit aan het maximum
  const from = P(id);
  if(g.mode==='buddy'){ drink(res, to, g.n, 'Drinkmaatje van '+from.name); g.left = 0; g.to = to; }
  else { g.left--; drink(res, to, 1, 'Van '+from.name); from.given++; S.curG = S.curG || {}; S.curG[id] = (S.curG[id]||0) + 1; }
  push();
}

function endRound(){
  const r = S.r; if(!r || S.phase!=='play') return;
  const res = {type:r.type, drinks:[], gives:[], note:''};
  S.res = res;
  const on = id => { const p = P(id); return p && p.on; };
  const D = (id,n,why) => drink(res, id, sip(n), why);
  const G = (id,n,why,mode) => { const k = sip(n); res.gives.push({id, n:k, left:mode==='buddy'?1:k, why, mode:mode||'give'}); };
  const A = r.ans || {};
  switch(r.type){
    case 'quiz': {
      const cnt=[0,0,0,0]; let best=null;
      r.ids.forEach(id => {
        const a = A[id];
        if(!a){ if(on(id)) D(id,2,'Geen antwoord'); return; }
        cnt[a.v]++;
        if(a.v!==r.ok) D(id,2,'Fout antwoord');
        else if(!best || a.t<best.t) best = {id, t:a.t};
      });
      if(best) G(best.id,3,'Snelste goede antwoord');
      res.q = r.q; res.bars = r.opts.map((o,i) => ({label:o, n:cnt[i], hi:i===r.ok, k:i}));
      res.note = best ? `${nm(best.id)} was het snelst met het goede antwoord (${secs(best.t)})` : 'Niemand had het goed!';
      break;
    }
    case 'likely': {
      const t = {};
      r.ids.forEach(id => { const a = A[id]; if(a && P(a.v)) t[a.v] = (t[a.v]||0) + 1; });
      const max = Math.max(0, ...Object.values(t));
      if(!max){ res.note = 'Niemand heeft gestemd, dus iedereen drinkt 1.'; r.ids.filter(on).forEach(id => D(id,1,'Niemand stemde')); }
      else {
        const top = Object.keys(t).filter(id => t[id]===max);
        top.forEach(id => D(id, Math.min(max+1,4), `${max} ${max===1?'stem':'stemmen'}`));
        res.note = top.length>1 ? 'Gelijkspel! Ze drinken allemaal.' : `${nm(top[0])} kreeg de meeste stemmen.`;
      }
      res.q = r.q;
      res.bars = Object.keys(t).sort((a,b) => t[b]-t[a]).map(id => ({label:nm(id), n:t[id], hi:t[id]===max, color:(P(id)||{}).color, id}));
      break;
    }
    case 'never': {
      let wel=0, nooit=0;
      r.ids.forEach(id => { const a = A[id]; if(!a){ if(on(id)) D(id,1,'Geen antwoord'); return; } if(a.v===0){ wel++; D(id,1,'Wel gedaan'); } else nooit++; });
      res.q = r.q; res.bars = [{label:'Wel gedaan', n:wel, color:'#ff4d5e'}, {label:'Nooit gedaan', n:nooit, color:'#3ddc84'}];
      res.note = wel ? `${wel} ${wel===1?'speler heeft':'spelers hebben'} het wel gedaan.` : 'Wat een heilige boontjes!';
      break;
    }
    case 'tot': {
      const g = [[],[]];
      r.ids.forEach(id => { const a = A[id]; if(!a){ if(on(id)) D(id,2,'Geen keuze'); return; } g[a.v].push(id); });
      if(g[0].length===g[1].length){ if(g[0].length){ g[0].concat(g[1]).forEach(id => D(id,1,'Gelijkspel')); res.note = 'Gelijkspel: iedereen drinkt 1.'; } else res.note = 'Niemand koos iets.'; }
      else {
        const small = g[0].length < g[1].length ? 0 : 1;
        if(g[small].length){ g[small].forEach(id => D(id,2,'Kleinste groep')); res.note = `De kleinste groep (${r.opts[small]}) drinkt.`; }
        else res.note = 'Iedereen koos hetzelfde, dus niemand drinkt.';
      }
      res.q = `${r.opts[0]} of ${r.opts[1]}?`;
      res.bars = r.opts.map((o,i) => ({label:o, n:g[i].length, color:i ? '#2f7de1' : '#f08a24'}));
      break;
    }
    case 'tap': {
      const valid = [];
      r.ids.forEach(id => { const a = A[id]; if(!a){ if(on(id)) D(id,2,'Niet getikt'); return; } if(a.early) D(id,1,'Te vroeg getikt'); else valid.push({id, t:Math.max(0,a.t-r.goAt)}); });
      valid.sort((a,b) => a.t-b.t);
      if(valid.length){ G(valid[0].id,2,'Snelste tikker'); if(valid.length>1) D(valid[valid.length-1].id,2,'Laatste tikker'); }
      res.bars = valid.map((v,i) => ({label:nm(v.id), n:v.t, txt:secs(v.t), hi:i===0, color:(P(v.id)||{}).color}));
      res.note = valid.length ? `${nm(valid[0].id)} was het snelst!` : 'Niemand tikte op tijd.';
      break;
    }
    case 'wheel': {
      const w = r.who; res.who = w; res.out = r.out;
      if(r.out==='drink'){ D(w,2,'Het slokkenrad'); res.note = `Het rad wijst ${nm(w)} aan: drinken!`; }
      else if(r.out==='give'){ G(w,3,'Het slokkenrad'); res.note = `${nm(w)} mag uitdelen.`; }
      else if(r.out==='buddy'){ D(w,2,'Drinkmaatje kiezen'); G(w,2,'Kies een drinkmaatje','buddy'); res.note = `${nm(w)} kiest een drinkmaatje. Jullie drinken allebei.`; }
      else if(r.out==='all'){ r.ids.filter(on).forEach(id => D(id,1,'Het slokkenrad')); res.note = 'Het rad zegt: iedereen drinkt!'; }
      else { G(w,1,'Veilig, deelt 1 uit'); res.note = `${nm(w)} is veilig en deelt 1 uit.`; }
      break;
    }
    case 'rad': {
      res.who = r.who; res.dare = r.dare; res.cat = r.cat; res.nr = r.nr; res.dec = r.dec || 'time';
      if(r.dec==='done'){ G(r.who,1,'Opdracht uitgevoerd'); res.note = `${nm(r.who)} deed de opdracht!`; }
      else { D(r.who, r.n, r.dec==='drink' ? 'Opdracht geweigerd' : 'Tijd om'); res.note = r.dec==='drink' ? `${nm(r.who)} durfde niet en drinkt.` : 'De tijd is om, dus drinken!'; }
      break;
    }
    case 'bq': {
      const B = S.bus; res.cards = {}; res.q = r.q;
      r.ids.forEach(id => {
        if(!B.deck.length) B.deck = newDeck(1);
        const c = B.deck.pop(); const hand = B.hands[id] || (B.hands[id] = []);
        const a = A[id];
        const ok = a ? busCheck(r.q, hand.map(h => h.c), c, a.v) : false;
        hand.push({c, u:0});
        res.cards[id] = {c, ok, v:a ? a.v : null};
        if(ok) G(id, r.q, 'Goed geraden');
        else if(a || on(id)) D(id, r.q, a ? 'Fout geraden' : 'Geen antwoord');
      });
      break;
    }
    default: miniResult(r, res, D, G, on);
  }
  if(S.players.length<2) res.gives.forEach(g => g.left = 0);
  if(S.cm){ S.cm.note = res.note || ''; if(r.type==='rad') S.cm.who = r.who; }
  S.phase = 'result'; push();
}

/* ---------- Minigames en Wel of Niet ---------- */
const norm = s => String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function lev(a, b){
  if(a===b) return 0; if(!a.length) return b.length; if(!b.length) return a.length;
  let prev = Array.from({length:b.length+1}, (_,i) => i);
  for(let i=1;i<=a.length;i++){
    const cur = [i];
    for(let j=1;j<=b.length;j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
// klopt een antwoord (kleine typfouten en een extra woordje mogen)
function matches(guess, answers){
  const g = norm(guess); if(!g) return false;
  return answers.some(a => {
    const x = norm(a); if(!x) return false;
    if(g===x) return 1;
    if(x.length>=5 && lev(g, x) <= (x.length>=9 ? 2 : 1)) return 1;
    return x.length>=4 && (' '+g+' ').includes(' '+x+' ');
  });
}
const nearWord = (a, b) => a===b || (b.length>=5 && lev(a, b)<=1);
const curTurn = r => r.order[r.turn % r.order.length];
function nextTurn(r, ms){
  for(let k=0;k<r.order.length;k++){
    r.turn++;
    const p = P(curTurn(r));
    if(p && p.on) break;
  }
  r.tdl = Date.now() + (ms || 15000);
}
const eligible = r => r.ids.filter(id => { const p = P(id); return p && p.on; });

function makeMini(type, ids, t0){
  const r = {type, ids, ans:{}, t0};
  if(type==='snel'){ r.stage = 'ready'; r.ready = {}; r.dl = t0 + 40000; }
  else if(type==='react'){ r.cd = t0 + 3000; r.goAt = r.cd + 1500 + Math.random()*4000; r.dl = r.goAt + 6000; r.col = pick(['#3ddc84','#ffc93c','#4cc9f0','#ff9f1c']); }
  else if(type==='getal'){ r.num = 1 + Math.floor(Math.random()*20); r.dl = t0 + 25000; }
  else if(type==='cat'){ r.cat = draw('cat', MV.categorie); r.order = shuffle(ids.slice()); r.turn = 0; r.used = []; r.tdl = t0 + 20000; r.msg = ''; }
  else if(type==='verb'){ r.word = draw('verb', MV.verboden); r.variant = ids.length>2 && Math.random()<.5 ? 'speler' : 'groep'; if(r.variant==='speler') r.target = pick(ids); }
  else if(type==='wbi'){ const q = draw('wbi', MV.wieBenIk); r.n = q.n; r.a = q.a; r.h = q.h; r.shown = 1; r.order = shuffle(ids.slice()); r.turn = 0; r.guesses = []; r.max = 4 + ids.length; r.tdl = t0 + 25000; }
  else if(type==='mem'){ r.words = shuffle(MV.geheugen.slice()).slice(0,10); r.stage = 'show'; r.dl = t0 + 15000; }
  else if(type==='emo'){ const q = draw('emo', MV.emoji); r.e = q.e; r.c = q.c; r.a = q.a; r.al = q.al; r.dl = t0 + 45000; }
  else if(type==='rps'){ r.alive = ids.slice(); r.sub = 1; r.stage = 'pick'; r.dl = t0 + 15000; r.rounds = []; }
  else if(type==='wnw'){ const q = draw('wnw', MV.waarNiet); r.f = q.f; r.w = q.w; r.x = q.x; r.dl = t0 + 20000; }
  else if(type==='wof'){ r.q = draw('wof', MV.welOfNiet); r.dl = t0 + 45000; }
  return r;
}
function miniText(r){
  return {snel:'Wie tikt het langzaamst?', react:'Tik als het scherm van kleur verandert', getal:'Raad het getal tussen 1 en 20 (het was '+r.num+')',
    cat:r.cat, verb:'Verboden woord: '+r.word, wbi:r.n, mem:'Onthoud 10 woorden', emo:r.e+' · '+r.c, rps:'Tot er één winnaar over is',
    wnw:r.f, wof:r.q}[r.type] || '';
}

/* 1 = afgehandeld (gepusht of afgelopen), 2 = niets gedaan maar geen standaard-deadline, 0 = standaard */
function miniTick(r, now){
  if(r.type==='snel' && r.stage==='ready'){
    const el = eligible(r);
    if(now>=r.dl || (el.length && el.every(id => r.ready[id]))){ snelGo(r); push(); return 1; }
    return 0;
  }
  if(r.type==='mem' && r.stage==='show' && now>=r.dl){ r.stage = 'type'; r.ts = now; r.dl = now + 60000; push(); return 1; }
  if(r.type==='cat' || r.type==='wbi'){
    if(r.out || r.winner) return 2;
    const cur = curTurn(r), p = P(cur);
    if(now>=r.tdl){
      if(r.type==='cat'){ r.out = {id:cur, why:'De tijd was om'}; endRound(); }
      else wbiGuess(r, cur, '', true);
      return 1;
    }
    if(!p || !p.on){ if(eligible(r).length){ nextTurn(r); push(); return 1; } return 2; }
    return 2;
  }
  if(r.type==='rps'){
    if(r.stage==='pick' && now>=r.dl){ rpsResolve(r); return 1; }
    if(r.stage==='show' && now>=r.next){
      if(r.alive.length<=1 || r.sub>=15){ endRound(); return 1; }
      r.sub++; r.ans = {}; r.stage = 'pick'; r.dl = now + 15000; push(); return 1;
    }
    return 2;
  }
  return 0;
}
function snelGo(r){ r.stage = 'go'; r.goAt = Date.now() + 2000 + Math.random()*5000; r.dl = r.goAt + 6000; }

function miniAnswer(id, m, r){
  if(!r.ids.includes(id)) return;
  const v = m.v;
  switch(r.type){
    case 'snel': case 'react': {
      if(r.type==='snel' && r.stage==='ready'){
        if(v==='ready'){ r.ready[id] = 1; const el = eligible(r); if(el.every(x => r.ready[x])) snelGo(r); push(); }
        return;
      }
      if(v!=='tap' || r.ans[id]) return;
      const at = Math.min(Number(m.at)||Date.now(), Date.now());
      r.ans[id] = {t:at, early: at < r.goAt};
      break;
    }
    case 'getal': { const n = Math.round(Number(v)); if(r.ans[id] || !(n>=1 && n<=20)) return; r.ans[id] = {v:n}; break; }
    case 'wnw': case 'wof': { if(r.ans[id] || (v!==0 && v!==1)) return; r.ans[id] = {v, t:Date.now()-r.t0}; break; }
    case 'emo': {
      if(r.ans[id] || typeof v!=='string') return;
      const g = v.trim().slice(0,60); if(!g) return;
      r.ans[id] = {v:g, ok:matches(g, [r.a].concat(r.al||[])), t:Date.now()-r.t0};
      break;
    }
    case 'mem': {
      if(r.stage!=='type' || r.ans[id] || !Array.isArray(v)) return;
      const words = [...new Set(v.slice(0,25).map(x => norm(x).slice(0,30)).filter(Boolean))];
      const hit = r.words.filter(w => words.some(x => nearWord(x, norm(w))));
      r.ans[id] = {v:words, ok:hit.length, hit};
      break;
    }
    case 'cat': {
      if(r.out || id!==curTurn(r)) return;
      if(v==='pass'){ r.out = {id, why:'Wist niets meer'}; endRound(); return; }
      if(typeof v!=='string') return;
      const w = v.trim().replace(/\s+/g,' ').slice(0,40); if(!norm(w)) return;
      if(r.used.some(u => norm(u.w)===norm(w))){ r.msg = '"'+w+'" is al genoemd. Probeer iets anders!'; push(); return; }
      r.used.push({id, w}); r.msg = ''; nextTurn(r, 12000); push(); return;
    }
    case 'verb': {
      if(r.out || v!=='said') return;
      const who = m.who; if(!r.ids.includes(who) || !P(who)) return;
      if(r.variant==='speler' && (who!==r.target || id===r.target)) return;
      r.out = {id:who, by:id}; endRound(); return;
    }
    case 'wbi': {
      if(r.winner || id!==curTurn(r) || typeof v!=='string') return;
      const g = v.trim().slice(0,50); if(!g) return;
      wbiGuess(r, id, g); return;
    }
    case 'rps': {
      if(r.stage!=='pick' || !r.alive.includes(id) || r.ans[id] || ![0,1,2].includes(v)) return;
      r.ans[id] = {v};
      if(r.alive.every(x => r.ans[x] || !(P(x) && P(x).on))) rpsResolve(r); else push();
      return;
    }
    default: return;
  }
  if(allIn(r)) endRound(); else push();
}
function wbiGuess(r, id, g, timeout){
  const ok = !timeout && matches(g, [r.n].concat(r.a));
  r.guesses.push({id, g: timeout ? '' : g, ok});
  if(ok){ r.winner = id; endRound(); return; }
  r.shown = Math.min(r.h.length, r.shown + 1);
  if(r.guesses.length >= r.max){ endRound(); return; }
  nextTurn(r, 25000); push();
}
const BEATS = (a, b) => (a===0 && b===2) || (a===1 && b===0) || (a===2 && b===1);
function rpsResolve(r){
  const answered = r.alive.filter(x => r.ans[x]);
  if(!answered.length){ endRound(); return; }
  let out = r.alive.filter(x => !r.ans[x]);
  const kinds = [...new Set(answered.map(x => r.ans[x].v))];
  if(kinds.length===2){ const win = BEATS(kinds[0], kinds[1]) ? kinds[0] : kinds[1]; out = out.concat(answered.filter(x => r.ans[x].v!==win)); }
  const picks = {}; answered.forEach(x => picks[x] = r.ans[x].v);
  r.rounds.push({picks, out, all:r.alive.slice()});
  r.alive = r.alive.filter(x => !out.includes(x));
  r.stage = 'show'; r.next = Date.now() + 3800; r.dl = r.next;
  push();
}

/* uitslag van een minigame of Wel of Niet */
function miniResult(r, res, D, G, on){
  const A = r.ans || {};
  res.mini = true;
  switch(r.type){
    case 'snel': case 'react': {
      const valid = [], lose = [];
      r.ids.forEach(id => {
        const a = A[id];
        if(!a){ if(on(id)) lose.push([id,'Niet getikt']); return; }
        if(a.early) lose.push([id,'Te vroeg getikt']); else valid.push({id, t:Math.max(0, a.t - r.goAt)});
      });
      valid.sort((a,b) => a.t-b.t);
      if(!lose.length && valid.length>1) lose.push([valid[valid.length-1].id, r.type==='react' ? 'Langzaamste reactie' : 'Langzaamste vinger']);
      lose.forEach(([id,why]) => D(id, 2, why));
      res.bars = valid.map((v,i) => ({label:nm(v.id), n:v.t, txt:secs(v.t), hi:i===0, color:(P(v.id)||{}).color, id:v.id}));
      res.note = lose.length ? lose.map(l => nm(l[0])).join(', ')+(lose.length>1 ? ' verliezen.' : ' verliest.') : (valid.length ? nm(valid[0].id)+' was het snelst!' : 'Niemand tikte.');
      break;
    }
    case 'getal': {
      res.num = r.num; const rows = [];
      r.ids.forEach(id => { const a = A[id]; if(a) rows.push({id, v:a.v, d:Math.abs(a.v - r.num)}); });
      const max = rows.length ? Math.max(...rows.map(x => x.d)) : 0;
      const losers = rows.filter(x => x.d===max && rows.length>1).map(x => x.id);
      r.ids.forEach(id => { if(!A[id] && on(id)) D(id, 2, 'Niets geraden'); });
      losers.forEach(id => D(id, 2, max===1 ? 'Er 1 naast' : 'Er '+max+' naast'));
      rows.filter(x => x.d===0).forEach(x => G(x.id, 2, 'Precies goed!'));
      res.rows = rows.sort((a,b) => a.d-b.d);
      res.note = losers.length>1 ? 'Gelijkspel: '+losers.map(nm).join(' en ')+' zaten er het verst naast.' : losers.length ? nm(losers[0])+' zat er het verst naast.' : rows.length ? 'Iedereen zat er even ver naast!' : 'Niemand heeft geraden.';
      break;
    }
    case 'cat': {
      res.cat = r.cat; res.used = r.used;
      if(r.out){ D(r.out.id, 2, r.out.why); res.out = r.out; res.note = nm(r.out.id)+' ligt eruit: '+r.out.why.charAt(0).toLowerCase()+r.out.why.slice(1)+'.'; }
      else res.note = 'De ronde is gestopt. Niemand verliest.';
      break;
    }
    case 'verb': {
      res.word = r.word; res.variant = r.variant; res.target = r.target;
      if(r.out){ D(r.out.id, 2, 'Zei "'+r.word+'"'); res.out = r.out; res.note = nm(r.out.id)+' zei het verboden woord!'; }
      else res.note = 'Niemand zei het woord. Knap!';
      break;
    }
    case 'wbi': {
      res.n = r.n; res.h = r.h.slice(0, r.shown); res.guesses = r.guesses; res.winner = r.winner || null;
      if(r.winner){ G(r.winner, 3, 'Raadde '+r.n); res.note = nm(r.winner)+' raadde het na '+res.h.length+' '+(res.h.length===1?'hint':'hints')+'!'; }
      else { r.ids.filter(on).forEach(id => D(id, 1, 'Niemand raadde het')); res.note = 'Niemand raadde het. Iedereen drinkt.'; }
      break;
    }
    case 'mem': {
      res.words = r.words;
      const rows = r.ids.filter(id => A[id] || on(id)).map(id => ({id, ok:A[id] ? A[id].ok : 0, hit:A[id] ? A[id].hit : []}));
      if(rows.length){
        const min = Math.min(...rows.map(x => x.ok)), max = Math.max(...rows.map(x => x.ok));
        if(rows.length>1 && min!==max){
          rows.filter(x => x.ok===min).forEach(x => D(x.id, 2, min===1 ? '1 woord onthouden' : min+' woorden onthouden'));
          const top = rows.filter(x => x.ok===max); if(top.length===1) G(top[0].id, 1, 'Beste geheugen');
          res.note = rows.filter(x => x.ok===min).map(x => nm(x.id)).join(' en ')+' wist het minst.';
        } else res.note = rows.length>1 ? 'Gelijkspel: iedereen wist er evenveel.' : '';
      }
      res.rows = rows.sort((a,b) => b.ok-a.ok);
      break;
    }
    case 'emo': {
      res.e = r.e; res.c = r.c; res.a = r.a;
      const good = r.ids.filter(id => A[id] && A[id].ok).sort((a,b) => A[a].t - A[b].t);
      r.ids.forEach(id => { const a = A[id]; if(a && !a.ok) D(id, 1, 'Fout geraden'); else if(!a && on(id)) D(id, 1, 'Niets geraden'); });
      if(good.length) G(good[0], 2, 'Snelste goede antwoord');
      res.rows = r.ids.filter(id => A[id]).map(id => ({id, v:A[id].v, ok:A[id].ok}));
      res.note = good.length ? nm(good[0])+' had het als eerste goed!' : 'Niemand had het goed.';
      break;
    }
    case 'rps': {
      res.rounds = r.rounds; const w = r.alive.length===1 ? r.alive[0] : null; res.winner = w;
      if(w){ r.ids.filter(id => id!==w && (on(id) || r.rounds.some(x => x.all.includes(id)))).forEach(id => D(id, 1, 'Verloren bij steen-papier-schaar')); G(w, 2, 'Winnaar'); res.note = nm(w)+' wint steen-papier-schaar!'; }
      else res.note = 'Geen winnaar deze keer.';
      break;
    }
    case 'wnw': {
      res.f = r.f; res.w = r.w; res.x = r.x; S.score = S.score || {}; S.curS = S.curS || {};
      let ok = 0, bad = 0;
      r.ids.forEach(id => {
        const a = A[id];
        if(a && (a.v===0)===r.w){ ok++; S.score[id] = (S.score[id]||0) + 1; S.curS[id] = (S.curS[id]||0) + 1; }
        else if(a){ bad++; D(id, 1, 'Fout gegokt'); }
        else if(on(id)) D(id, 1, 'Niets gekozen');
      });
      res.board = S.players.map(p => ({id:p.id, s:S.score[p.id]||0})).sort((a,b) => b.s-a.s);
      res.note = ok ? ok+(ok===1?' speler had':' spelers hadden')+' het goed.' : 'Niemand had het goed!';
      break;
    }
    case 'wof': {
      res.q = r.q; S.pen = S.pen || {}; S.curP = S.curP || {};
      const ja = r.ids.filter(id => A[id] && A[id].v===0), nee = r.ids.filter(id => A[id] && A[id].v===1);
      res.ja = ja; res.nee = nee;
      const minority = ja.length===nee.length ? null : (ja.length < nee.length ? 'ja' : 'nee');
      res.minority = minority;
      const pen = minority ? (minority==='ja' ? ja : nee) : [];
      pen.forEach(id => { S.pen[id] = (S.pen[id]||0) + 1; S.curP[id] = (S.curP[id]||0) + 1; D(id, 1, 'Strafpunt: minderheid'); });
      r.ids.forEach(id => { if(!A[id] && on(id)){ S.pen[id] = (S.pen[id]||0) + 1; S.curP[id] = (S.curP[id]||0) + 1; D(id, 1, 'Strafpunt: geen antwoord'); } });
      res.revealAt = Date.now() + 3000;
      res.note = !ja.length && !nee.length ? 'Niemand heeft gekozen.' : minority ? 'De '+minority.toUpperCase()+'-groep is de minderheid en krijgt een strafpunt.' : 'Precies gelijk verdeeld: niemand krijgt een strafpunt.';
      break;
    }
  }
}

/* ronde opnieuw: slokken, uitdelingen en punten van deze ronde terugdraaien */
function restartRound(){
  if(!S.r || S.mode==='bus' || !['play','result'].includes(S.phase)) return;
  const back = (map, f) => Object.entries(map||{}).forEach(([id,n]) => { const p = P(id); if(p) f(p, id, n); });
  back(S.cur, (p,id,n) => p.drunk = Math.max(0, p.drunk - n));
  back(S.curG, (p,id,n) => p.given = Math.max(0, p.given - n));
  back(S.curS, (p,id,n) => S.score[id] = Math.max(0, (S.score[id]||0) - n));
  back(S.curP, (p,id,n) => S.pen[id] = Math.max(0, (S.pen[id]||0) - n));
  if(S.r.type==='dow'){ const r = S.r; if(r.ps!=null && S.tstreak) S.tstreak[r.who] = r.ps; if(S.players.length) S.dowIdx = ((S.dowIdx==null ? 0 : S.dowIdx) - 1 + S.players.length) % S.players.length; }
  const type = S.r.type;
  S.cm = null; resetCur(); S.res = null;
  startRound(type === 'rad' ? 'rad' : type);
}

/* ---------- Doen of Waarheid ---------- */
const DW = window.SLOKKIE_DOW || {waarheidNormaal:[], doenNormaal:[], waarheidSpicy:[], doenSpicy:[]};
function dowPool(kind, spicy){ return kind==='doen' ? (spicy ? DW.doenSpicy : DW.doenNormaal) : (spicy ? DW.waarheidSpicy : DW.waarheidNormaal); }
// volgende actieve speler in vaste volgorde
function dowNextPlayer(){
  const list = S.players; if(!list.length) return myId;
  let i = S.dowIdx==null ? -1 : S.dowIdx;
  for(let k=0;k<list.length;k++){ i = (i+1) % list.length; if(list[i].on){ S.dowIdx = i; return list[i].id; } }
  S.dowIdx = 0; return list[0].id;
}
function makeDow(ids, t0){
  const who = dowNextPlayer(); S.tstreak = S.tstreak || {};
  return {type:'dow', ids, ans:{}, t0, who, stage:'choose', lock:(S.tstreak[who]||0) >= 2, spicy:S.set.dow==='spicy'};
}
// wie het rad kan kiezen: iemand van het andere geslacht, anders iedereen behalve jezelf
function dowTargets(who){
  const p = P(who), others = active().filter(q => q.id!==who);
  const opp = p && p.g ? others.filter(q => q.g && q.g!==p.g) : [];
  return opp.length ? {list:opp.map(q => q.id), opp:true} : {list:others.map(q => q.id), opp:false};
}
function dowAnswer(id, m, r){
  if(id!==r.who && id!==myId) return;   // de host mag namens de speler kiezen
  const v = m.v, now = Date.now();
  if(r.stage==='choose' && (v==='doen' || v==='waarheid')){
    if(v==='waarheid' && r.lock) return;
    S.tstreak = S.tstreak || {};
    r.ps = S.tstreak[r.who] || 0;
    S.tstreak[r.who] = v==='waarheid' ? r.ps + 1 : 0;
    const pool = dowPool(v, r.spicy);
    const q = pool.length ? draw('dow-'+(r.spicy ? 's' : 'n')+'-'+v, pool) : {id:'leeg', t:'Er zijn geen vragen gevonden.'};
    r.kind = v; r.q = q.t; r.qid = q.id;
    if(S.cm){ S.cm.label = (v==='doen' ? 'Doen' : 'Waarheid')+' · '+nm(r.who); S.cm.text = q.t; }
    if(q.rad){
      const tg = dowTargets(r.who);
      if(tg.list.length){
        r.target = pick(tg.list); r.opp = tg.opp;
        const reel = []; for(let k=0;k<6;k++) reel.push(...shuffle(tg.list.slice()));
        reel.push(r.target); r.reel = reel.slice(-22);
        r.stage = 'wheel'; r.ts = now; r.until = now + 3200; push(); return;
      }
    }
    r.stage = 'card'; r.ts = now; push(); return;
  }
  if(r.stage==='card' && (v==='done' || v==='skip')){
    r.stage = v; r.ts = now; r.next = now + (v==='skip' ? 3400 : 2000);
    if(v==='skip'){
      r.pen = addSips(r.who, sip(2));
      S.pen = S.pen || {}; S.curP = S.curP || {};
      S.pen[r.who] = (S.pen[r.who]||0) + 1; S.curP[r.who] = (S.curP[r.who]||0) + 1;
    }
    if(S.cm) S.cm.note = (v==='done' ? 'Voltooid' : 'Overgeslagen') + (r.target ? ' · met '+nm(r.target) : '');
    push();
  }
}
function dowTick(r, now){
  if(r.stage==='wheel' && now>=r.until){ r.stage = 'card'; r.ts = now; push(); return 1; }
  if((r.stage==='done' || r.stage==='skip') && now>=r.next){ nextRound(); return 1; }
  return 2;
}

/* ---------- Bussen ---------- */
const ROWSTART = [0,5,9,12,14];
const rowOf = i => i<5 ? 1 : i<9 ? 2 : i<12 ? 3 : i<14 ? 4 : 5;
function busStart(){
  const ids = active().map(p => p.id);
  const decks = Math.max(1, Math.ceil((ids.length*4 + 15) / 52));
  S.bus = {stage:'guess', deck:newDeck(decks), hands:{}, ids, pyr:[], flip:0, driver:null, ride:null};
  ids.forEach(id => S.bus.hands[id] = []);
  S.total = 4; busQuestion(1);
}
function busQuestion(q){
  S.n = q; S.res = null; S.phase = 'play';
  const t0 = Date.now();
  S.r = {type:'bq', q, ids:S.bus.ids.filter(id => P(id)), ans:{}, t0, dl:t0+20000};
  bucket('Bussen · vraag '+q, BUSQ[q-1].t);
  push();
}
function busCheck(q, prev, c, v){
  const x = cv(c);
  if(q===1) return (v===0) === isRed(c);
  if(q===2){ const p = cv(prev[0]); return v===0 ? x>p : x<p; }
  if(q===3){ const a = cv(prev[0]), b = cv(prev[1]), lo = Math.min(a,b), hi = Math.max(a,b); return v===0 ? (x>lo && x<hi) : (x<lo || x>hi); }
  const has = prev.some(p => cs(p)===cs(c)); return v===0 ? has : !has;
}
function busPyramid(){
  const B = S.bus; B.stage = 'pyr';
  if(B.deck.length<15) B.deck = newDeck(1).concat(B.deck);
  B.pyr = B.deck.splice(-15); B.flip = 0; B.sumRow = 0;
  S.n = 5; bucket('Piramide · rij 1', 'Kaarten in rij 1 tellen 1 slok');
  S.r = {type:'pyr', t0:Date.now()}; S.res = null; S.phase = 'play'; push();
}
function busFlip(){
  const B = S.bus; if(!B || B.flip>=15) return;
  const i = B.flip++; const c = B.pyr[i]; const row = rowOf(i); const x = cv(c);
  const prev = S.res;
  const res = {type:'pyr', c, row, drinks:[], gives:(prev && prev.gives ? prev.gives.filter(g => g.left>0) : []), laid:[]};
  B.ids.forEach(id => {
    let k = 0; (B.hands[id]||[]).forEach(h => { if(!h.u && cv(h.c)===x){ h.u = 1; k++; } });
    if(k){ res.laid.push({id, k}); const n = sip(row*k); res.gives.push({id, n, left:n, why:`${k}× ${VAL(x)} gelegd in rij ${row}`, mode:'give'}); }
  });
  if(S.players.length<2) res.gives.forEach(g => g.left = 0);
  S.res = res; push();
}
function busDriver(){
  const B = S.bus; let best = null;
  B.ids.forEach(id => {
    const left = (B.hands[id]||[]).filter(h => !h.u);
    const sc = left.length*1000 + left.reduce((s,h) => s+cv(h.c), 0) + Math.random();
    if(!best || sc>best.sc) best = {id, sc};
  });
  B.driver = best ? best.id : myId; B.stage = 'ride';
  B.ride = {tries:1, total:0, deck:newDeck(1)};
  rideDeal();
  S.n = 10; bucket('De bus', nm(B.driver)+' moest de bus in');
  S.r = {type:'ride', t0:Date.now()}; S.res = null; S.phase = 'play'; push();
}
const rowDone = B => B.flip>0 && [5,9,12,14,15].includes(B.flip) && (B.sumRow||0) < rowOf(B.flip-1);
function busSum(){ if(S.bus.stage==='pyr') S.bus.sumRow = rowOf(S.bus.flip-1); S.phase = 'sum'; push(); }
function busAfterSum(){
  const B = S.bus;
  if(B.stage==='guess'){ if(S.r.q<4) busQuestion(S.r.q+1); else busPyramid(); }
  else if(B.stage==='pyr'){
    if(B.sumRow>=5){ busDriver(); return; }
    const row = B.sumRow+1;
    S.n = 4+row; bucket('Piramide · rij '+row, 'Kaarten in rij '+row+' tellen '+row+' '+sl(row));
    if(!(S.res && S.res.gives.some(g => g.left>0))) S.res = null;
    S.phase = 'play'; push();
  } else goEnd();
}
function rideDeal(){
  const R = S.bus.ride;
  if(R.deck.length<6) R.deck = newDeck(1);
  R.cards = R.deck.splice(-6); R.pos = 1; R.st = 'guess'; R.fail = null;
}
function rideAct(v){
  const R = S.bus && S.bus.ride; if(!R) return;
  if(v==='again'){ if(R.st!=='fail') return; R.tries++; rideDeal(); push(); return; }
  if(R.st!=='guess' || (v!=='hoger' && v!=='lager')) return;
  const prev = cv(R.cards[R.pos-1]), cur = cv(R.cards[R.pos]);
  const ok = v==='hoger' ? cur>prev : cur<prev;
  if(ok){ R.pos++; if(R.pos>5){ R.st = 'win'; S.bus.stage = 'done'; if(S.cm) S.cm.note = `Uit de bus na ${R.tries} ${R.tries===1?'poging':'pogingen'}`; } }
  else {
    const want = sip(R.pos), n = addSips(S.bus.driver, want);
    R.st = 'fail'; R.fail = {pos:R.pos, n, capped:n<want}; R.total += n;
    if(S.cm) S.cm.note = `${R.tries} ${R.tries===1?'poging':'pogingen'}`;
  }
  push();
}

/* ================= Speler: netwerk ================= */
const C = { peer:null, conn:null, chan:null, cid:rid(6), lastMsg:0, lastPing:0, lastRe:0, welcomed:false, wasIn:false, retryT:null, joinT:null };

function clientJoin(code){
  role = 'player'; S = null; myId = null; ui.code = code; C.welcomed = false; netOk = false; lastDrunk = null;
  store.set('last', {role:'player', code, at:Date.now(), pid:PROF && PROF.id});
  clientNet(); render();
}
function joinMsg(){ return {t:'join', name:me.name, g:me.gender || '', drive:me.drive, av:me.avatar || ''}; }
function clientNet(){
  if(role!=='player') return;
  if(LOCAL){
    if(!C.chan){
      C.chan = new BroadcastChannel('slokkie-local-'+ui.code);
      C.chan.onmessage = e => { const d = e.data; if(d && (d.to===C.cid || d.to==='*')) clientMsg(d.m); };
    }
    csend(joinMsg());
    clearTimeout(C.joinT);
    C.joinT = setTimeout(() => { if(role==='player' && !C.welcomed && !C.wasIn) fail('Geen spel gevonden met code '+ui.code+'.'); }, 3500);
    return;
  }
  clientRelay();
  if(!C.welcomed && !C.wasIn && !C.joinT){
    C.joinT = setTimeout(() => { C.joinT = null; if(role==='player' && !C.welcomed && !C.wasIn) fail('Geen spel gevonden met code '+ui.code+'.'); }, 12000);
  }
  if(typeof Peer !== 'function'){ retry(); return; }
  if(!C.peer || C.peer.destroyed){ makePeer(); return; }
  if(C.peer.disconnected){ try{ C.peer.reconnect(); }catch(e){ try{ C.peer.destroy(); }catch(_){} makePeer(); } return; }
  if(C.peer.open) cconnect();
}
function makePeer(){
  const peer = C.peer = new Peer({debug:1});
  peer.on('open', () => { if(C.peer===peer) cconnect(); });
  peer.on('disconnected', () => { if(C.peer===peer && !peer.destroyed) setTimeout(() => { try{ if(peer.disconnected && !peer.destroyed) peer.reconnect(); }catch(e){} }, 1500); });
  peer.on('error', err => {
    if(C.peer!==peer) return;
    // de relay kan nog werken, dus hier niet opgeven; de join-timer beslist of het spel bestaat
    if(err.type==='peer-unavailable'){ retry(5000); return; }
    if(['network','server-error','socket-error','socket-closed','browser-incompatible'].includes(err.type)){ try{ peer.destroy(); }catch(e){} retry(); }
  });
}
function cconnect(){
  if(role!=='player' || !C.peer) return;
  if(C.conn){ const old = C.conn; C.conn = null; try{ old.close(); }catch(e){} }
  const conn = C.conn = C.peer.connect(PREFIX+ui.code, {serialization:'json', reliable:true});
  if(!conn){ retry(); return; }
  conn.on('open', () => { if(C.conn===conn) csend(joinMsg()); });
  conn.on('data', d => { if(C.conn===conn) clientMsg(d); });
  conn.on('close', () => { if(C.conn===conn){ C.conn = null; csend({t:'ping'}); retry(4000); } });
  conn.on('error', () => {});
  // WebRTC over verschillende netwerken kan traag zijn; de relay houdt het spel intussen gaande
  setTimeout(() => { if(C.conn===conn && !conn.open) retry(); }, 25000);
}
function retry(ms){ clearTimeout(C.retryT); C.retryT = setTimeout(clientNet, ms||2500); }
function clientRelay(){
  if(LOCAL || C.mq || typeof mqtt==='undefined') return;
  const code = ui.code, cid = C.cid;
  C.mq = BROKERS.map(url => {
    const c = mqtt.connect(url, MQOPT());
    c.on('connect', () => {
      c.subscribe(TOP(code)+'/c/'+cid, () => {
        if(!(C.conn && C.conn.open)) c.publish(TOP(code)+'/h', JSON.stringify({from:cid, m:Object.assign(joinMsg(), {token:TOKEN})}));
      });
    });
    c.on('message', (t, buf) => { let m; try{ m = JSON.parse(buf.toString()); }catch(e){ return; } C.via = c; clientMsg(m); });
    c.on('error', () => {});
    return c;
  });
}
function csend(m){
  m.token = TOKEN;
  if(LOCAL){ if(C.chan) C.chan.postMessage({to:'host', from:C.cid, m}); return; }
  try{
    if(C.conn && C.conn.open){ C.conn.send(m); return; }
    const c = (C.via && C.via.connected) ? C.via : (C.mq || []).find(x => x.connected);
    if(c) c.publish(TOP(ui.code)+'/h', JSON.stringify({from:C.cid, m}));
  }catch(e){}
}
function clientMsg(m){
  if(!m || role!=='player') return;
  C.lastMsg = Date.now();
  if(m.t==='you'){ myId = m.id; C.welcomed = true; C.wasIn = true; return; }
  if(m.t==='who'){ csend(joinMsg()); return; }
  if(m.t==='avs'){ if(m.a && typeof m.a==='object'){ AVS = {}; Object.keys(m.a).forEach(k => { if(okAvatar(m.a[k])) AVS[k] = m.a[k]; }); last.app = null; render(); } return; }
  if(m.t==='state'){
    if(!myId || !m.s) return; // eerst welkom afwachten
    if(S && m.s.code===S.code && (m.s.seq||0) < (S.seq||0)) return; // oud bericht via de andere route
    offset = m.now - Date.now(); S = m.s; netOk = true;
    if(S.phase==='closed'){ leave(); toast('De host heeft het spel afgesloten.'); return; }
    if(S.code!==ui.code) ui.code = S.code;
    store.set('last', {role:'player', code:ui.code, at:Date.now(), pid:PROF && PROF.id});
    onState(); render();
  }
}
function clientTeardown(){
  clearTimeout(C.retryT); clearTimeout(C.joinT);
  try{ if(C.conn) C.conn.close(); }catch(e){}
  try{ if(C.peer) C.peer.destroy(); }catch(e){}
  try{ if(C.chan) C.chan.close(); }catch(e){}
  (C.mq || []).forEach(c => { try{ c.end(true); }catch(e){} });
  C.conn = null; C.peer = null; C.chan = null; C.mq = null; C.via = null; C.joinT = null; C.welcomed = false; C.wasIn = false;
}
function leave(){
  clientTeardown(); store.del('last');
  role = null; S = null; myId = null; netOk = false; lastDrunk = null; AVS = {};
  render();
}
function fail(msg){ leave(); ui.err = msg; render(); }

setInterval(() => {

    <div class="lbl">Spelcode</div>
    <div class="bigcode disp">${S.code}</div>
    <div class="qr">${qrSvg(joinUrl())}</div>
    <p>Scan de QR-code of vul de code in op Slokkie</p>

    if(S.mode==='wof') h += `<p class="hint">${MV.welOfNiet.length} spannende stellingen over relaties, geheimen en vriendschap. Iedereen kiest stiekem JA of NEE. De minderheid krijgt een strafpunt (${sip(1)} ${sl(sip(1))}). Bij gelijke verdeling niemand. Geen vraag komt twee keer.</p>`;
