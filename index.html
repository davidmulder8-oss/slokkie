/* ---------- ronde ---------- */
function rkey(){ const r = S && S.r; return r ? r.type+'-'+r.t0+'-'+(r.stage||'')+'-'+(r.sub||'') : ''; }
function myAns(){
  const r = S.r; if(!r) return null;
  if(r.ans && r.ans[myId]) return r.ans[myId];
  return ui.sent && ui.sent.k===rkey() ? ui.sent : null;
}
function head(label, r, from){
  if(!r.dl) return `<div class="rhead"><span class="pill">${label}</span></div>`;
  const tot = r.dl - (from || r.t0);
  return `<div class="rhead"><span class="pill">${label}</span><span class="tnum disp" data-dl="${r.dl}"></span></div><div class="tbar"><i data-dl="${r.dl}" data-tot="${tot}"></i></div>`;
}
function countLine(r){
  const elig = r.ids.filter(id => { const p = P(id); return p && p.on; });
  const done = elig.filter(id => r.ans[id]).length;
  return `<p class="count">${done}/${elig.length} gekozen</p>`;
}
function waitBox(title, extra){
  return `<div class="waitbox"><div class="spinner"></div><b>${title || 'Antwoord binnen!'}</b><span>${extra || 'Wachten op de rest…'}</span></div>`;
}
function wheelHtml(ids, who, start){
  const n = Math.max(1, ids.length), seg = 360/n;
  const grad = ids.map((id,i) => `${(P(id)||{}).color || '#777'} ${i*seg}deg ${(i+1)*seg}deg`).join(',');
  const i = Math.max(0, ids.indexOf(who));
  const end = 360*6 - (i+0.5)*seg;
  const el = Math.max(0, Math.min(3800, hnow() - start));
  return `<div class="wheelwrap"><div class="pointer"></div>
    <div class="wheel" style="--end:${end}deg;background:conic-gradient(${grad});animation-delay:-${Math.round(el/100)*100}ms">
      ${ids.map((id,k) => `<span style="transform:rotate(${(k+0.5)*seg}deg)"><b>${ini(nm(id))}</b></span>`).join('')}
    </div><div class="hub">${ic('beer')}</div></div>`;
}

function viewPlay(){
  const r = S.r; if(!r) return '';
  if(r.type==='pyr') return viewPyr();
  if(r.type==='ride') return viewRide();
  if(r.type==='rad') return viewRad(r);
  if(r.type==='bq') return viewBusQ(r);
  if(r.type==='dow') return viewDow(r);
  if(MINI[r.type] || r.type==='wof') return viewMini(r);
  const T = TYPES[r.type];
  const inR = r.ids.includes(myId);
  const mine = inR ? myAns() : null;
  let h = head(`${T.e} ${T.l}`, r);
  if(r.type==='wheel') return h + wheelHtml(r.ids, r.who, r.t0) + `<p class="count">Het slokkenrad draait…</p>`;
  if(!inR) return h + waitBox('Even wachten', 'Je doet vanaf de volgende ronde mee.');
  if(r.type==='quiz'){
    h += `<div class="q">${esc(r.q)}</div>`;
    if(mine) h += `<div class="tiles"><div class="tile k${mine.v}" style="grid-column:1/-1;min-height:80px">${SHAPES[mine.v]}<span>${esc(r.opts[mine.v])}</span></div></div>` + waitBox();
    else h += `<div class="tiles">${r.opts.map((o,i) => `<button class="tile k${i}" data-a="ans" data-v="${i}">${SHAPES[i]}<span>${esc(o)}</span></button>`).join('')}</div>`;
  } else if(r.type==='likely'){
    h += `<p class="pre">Wie is het meest waarschijnlijk om…</p><div class="q">${esc(r.q)}?</div>`;
    if(mine) h += waitBox('Gestemd!', `Je stemde op ${esc(nm(mine.v))}. Wachten op de rest…`);
    else h += `<div class="pgrid">${r.ids.map(id => `<button class="pbtn" data-a="ans" data-v="${id}">${av(id)}<span>${esc(nm(id))}</span></button>`).join('')}</div>`;
  } else if(r.type==='never'){
    h += `<p class="pre">Ik heb nog nooit…</p><div class="q">${esc(r.q)}</div>`;
    if(mine) h += waitBox(mine.v===0 ? 'Wel gedaan '+ic('beer') : 'Nooit gedaan 😇');
    else h += `<div class="two"><button class="bigopt o-red" data-a="ans" data-v="0">${ic('beer')} Wel gedaan</button><button class="bigopt o-green" data-a="ans" data-v="1">😇 Nooit gedaan</button></div>`;
  } else if(r.type==='tot'){
    h += `<div class="q center" style="margin-top:20px">Dit of dat?</div>`;
    if(mine) h += waitBox(esc(r.opts[mine.v]), 'De kleinste groep drinkt. Wachten op de rest…');
    else h += `<div class="two"><button class="bigopt o-org" data-a="ans" data-v="0">${esc(r.opts[0])}</button><div class="vs">of</div><button class="bigopt o-blue" data-a="ans" data-v="1">${esc(r.opts[1])}</button></div>`;
  } else if(r.type==='tap'){
    const go = hnow() >= r.goAt;
    if(mine) h += `<button class="tapbtn done">${mine.early ? 'Te vroeg! 😬' : 'Getikt! ⚡'}</button>`;
    else h += `<button class="tapbtn ${go?'go':'wait'}" data-tap="1">${go ? 'TIK!' : 'Wacht…'}</button>`;
    h += `<p class="sub center">Tik zodra de knop groen wordt. Te vroeg is 1 slok, de laatste drinkt 2.</p>`;
  }
  return h + countLine(r);
}

function viewRad(r){
  const isMe = r.who===myId, host = role==='host';
  if(r.stage==='spin') return head(ic('refresh')+' Het Rad', {}) + wheelHtml(r.ids, r.who, r.t0) + `<p class="count">Wie is er aan de beurt…</p>`;
  let h = head(ic('refresh')+' Het Rad', r, r.ts);
  h += `<div class="dare"><span class="tagl">${r.cat==='Flirt'?'💋':ic('fire')} ${esc(r.cat)} · #${r.nr}</span><div class="txt">${esc(r.dare)}</div></div>`;
  h += `<div class="turn">${av(r.who)}<span>${isMe ? 'Jij bent aan de beurt!' : esc(nm(r.who))+' is aan de beurt'}</span></div>`;
  const n = sip(r.n);
  if(isMe || host){
    if(!isMe) h += `<p class="sub">Als host kun je kiezen namens ${esc(nm(r.who))}:</p>`;
    h += `<div class="two"><button class="btn green" data-a="ans" data-v="done">${ic('check')} Gedaan</button><button class="btn red" data-a="ans" data-v="drink">${ic('beer')} Liever drinken (${n})</button></div>`;
  } else h += waitBox('Doet de opdracht of drinkt?', `Weigeren kost ${n} ${sl(n)}.`);
  return h;
}

function viewBusQ(r){
  const B = S.bus, Q = BUSQ[r.q-1];
  const inR = r.ids.includes(myId), mine = inR ? myAns() : null;
  const n = sip(r.q);
  let h = head(`${ic('cards')} Bussen · vraag ${r.q}/4`, r);
  if(!inR) return h + waitBox('Je kijkt mee', 'Dit potje Bussen was al begonnen. Volgende keer doe je mee!');
  const hand = B.hands[myId] || [];
  h += `<div class="hand">${hand.map(x => cardHtml(x.c)).join('')}<div class="pc next">?</div></div>`;
  h += `<div class="q center">${Q.t}</div><p class="sub center">${Q.h}<br>Goed: deel ${n} uit · Fout: drink ${n}</p>`;
  if(mine) h += waitBox(esc(Q.o[mine.v]), 'Wachten tot iedereen gekozen heeft…');
  else h += `<div class="two">${Q.o.map((o,i) => `<button class="bigopt ${Q.c[i]}" data-a="ans" data-v="${i}">${o}</button>`).join('')}</div>`;
  return h + countLine(r);
}

function viewPyr(){
  const B = S.bus, res = S.res;
  let h = `<div class="rhead"><span class="pill">${ic('ace')} De piramide</span><span class="pill">${B.flip}/15</span></div>`;
  h += `<div class="pyr">${[4,3,2,1,0].map(row => {
    const start = ROWSTART[row], size = 5-row;
    let cards = '';
    for(let i=start;i<start+size;i++) cards += i < B.flip ? cardHtml(B.pyr[i], i===B.flip-1 ? 'hl' : '', 'py'+S.gid+i) : cardHtml(null);
    return `<div class="prow"><span class="x">×${row+1}</span>${cards}</div>`;
  }).join('')}</div>`;
  if(!res) h += `<p class="sub center">De host draait de kaarten één voor één om, van onder naar boven. Heb je dezelfde waarde in je hand? Dan deel je slokken uit: rij 1 is 1 slok, de top is 5.</p>`;
  else {
    h += `<p class="note center">Rij ${res.row}: ${cardName(res.c)} · ${res.laid.length ? res.laid.map(l => `${esc(nm(l.id))} legt ${l.k}×`).join(', ') : 'niemand heeft deze kaart'}</p>`;
    h += personal(res, true);
    h += pendingOthers(res);
    if(res.drinks.length) h += `<h3>Wie drinkt er</h3>` + drinkList(res);
  }
  const hand = B.hands[myId];
  if(hand) h += `<h3>Jouw kaarten</h3><div class="hand">${hand.map(x => cardHtml(x.c, x.u ? 'used' : '')).join('')}</div>`;
  h += `<h3>Kaarten over</h3><div class="chips">${B.ids.filter(id => P(id)).map(id => `<span class="chip">${av(id)}${esc(nm(id))} · ${(B.hands[id]||[]).filter(x => !x.u).length}</span>`).join('')}</div>`;
  return h;
}

function viewRide(){
  const B = S.bus, R = B.ride, drv = B.driver;
  const isDrv = drv===myId, canAct = isDrv || role==='host';
  let h = `<div class="rhead"><span class="pill">🚌 De bus</span><span class="pill">Poging ${R.tries}</span></div>`;
  h += `<div class="q center" style="margin-top:18px">${isDrv ? 'Jij moet de bus in!' : esc(nm(drv))+' moet de bus in!'}</div>`;
  h += `<div class="busrow">${R.cards.map((c,i) => {
    const open = i < R.pos || R.st==='win' || (R.st==='fail' && i===R.pos);
    const cur = R.st==='guess' && i===R.pos;
    return `<div class="slot ${cur?'cur':''}">${cardHtml(open ? c : null, (R.st==='fail' && i===R.pos) ? 'hl' : '', open ? 'rd'+S.gid+R.tries+'-'+i : '')}<span>${i===0 ? 'start' : sip(i)}</span></div>`;
  }).join('')}</div>`;
  if(R.st==='guess'){
    h += `<p class="sub center">Is kaart ${R.pos} hoger of lager dan ${cardName(R.cards[R.pos-1])}? Gelijk is fout. Fout kost ${sip(R.pos)} ${sl(sip(R.pos))} en je begint opnieuw.</p>`;
    if(canAct){
      if(!isDrv) h += `<p class="sub center">Als host kun je kiezen namens ${esc(nm(drv))}.</p>`;
      h += `<div class="two" style="grid-template-columns:1fr 1fr"><button class="bigopt o-org" data-a="ans" data-v="hoger">⬆ Hoger</button><button class="bigopt o-blue" data-a="ans" data-v="lager">⬇ Lager</button></div>`;
    } else h += waitBox(`${esc(nm(drv))} raadt kaart ${R.pos}…`, 'Duimen maar.');
  } else if(R.st==='fail'){
    h += `<div class="me red"><div class="row"><div class="big">${R.fail.n}</div><div><b>${isDrv ? sl(R.fail.n)+' drinken' : esc(nm(drv))+' drinkt'}</b><small>${R.fail.capped ? DRV+' Rijmodus: maximum van 10 bereikt. ' : ''}Fout bij kaart ${R.fail.pos}: ${cardName(R.cards[R.fail.pos])}. Terug naar het begin!</small></div></div></div>`;
    if(canAct) h += `<button class="btn cream" data-a="ans" data-v="again">Opnieuw beginnen</button>`;
  } else {
    h += `<div class="me green"><div class="row"><div class="big">${ic('party')}</div><div><b>${isDrv ? 'Je bent uit de bus!' : esc(nm(drv))+' is uit de bus!'}</b><small>Na ${R.tries} ${R.tries===1?'poging':'pogingen'} en ${R.total} ${sl(R.total)}.</small></div></div></div>`;
  }
  h += `<h3>Kaarten over na de piramide</h3><div class="chips">${B.ids.filter(id => P(id)).map(id => `<span class="chip">${av(id)}${esc(nm(id))} · ${(B.hands[id]||[]).filter(x => !x.u).length}</span>`).join('')}</div>`;
  return h;
}

/* ---------- uitslag ---------- */
function personal(res, onlyGive){
  const myD = res.drinks.filter(d => d.id===myId);
  const n = myD.reduce((s,d) => s+d.n, 0);
  const why = [...new Set(myD.map(d => d.why))].join(', ');
  const open = res.gives.filter(g => g.id===myId && g.left>0);
  const done = res.gives.filter(g => g.id===myId && g.left===0);
  let h = '';
  if(n && !onlyGive) h += `<div class="me red"><div class="row"><div class="big">${n}</div><div><b>${sl(n)} drinken</b><small>${esc(why)}</small></div></div></div>`;
  if(open.length){
    const g = open[0], left = open.reduce((s,x) => s+x.left, 0);
    const others = S.players.filter(p => p.id!==myId);
    const buddy = g.mode==='buddy';
    h += `<div class="me yellow"><div class="row"><div class="big">${buddy ? ic('cheers') : left}</div><div><b>${buddy ? 'Kies een drinkmaatje' : sl(left)+' uitdelen'}</b><small>${esc(g.why)} · ${buddy ? `jullie drinken allebei ${g.n}` : 'tik op een speler voor elke slok'}</small></div></div>
      <div class="givegrid">${others.map(p => capLeft(p.id)<=0 ? `<button class="givebtn" disabled>${av(p.id)}<span>${esc(p.name)}<small>${DRV} max bereikt</small></span></button>` : `<button class="givebtn" data-a="give" data-id="${p.id}">${av(p.id)}<span>${esc(p.name)}${p.drive?' '+DRV:''}</span></button>`).join('')}</div></div>`;
  } else if(done.length && !n){
    const g = done[0];
    h += `<div class="me yellow"><div class="row"><div class="big">✓</div><div><b>${g.mode==='buddy' ? 'Drinkmaatje gekozen' : 'Uitgedeeld!'}</b><small>${esc(g.why)}</small></div></div></div>`;
  } else if(!n && !onlyGive){
    h += `<div class="me green"><div class="row"><div class="big">${ic('thumbup')}</div><div><b>Je bent veilig</b><small>Geen slokken voor jou deze ronde.</small></div></div></div>`;
  }
  return h;
}
function pendingOthers(res){
  const pend = res.gives.filter(g => g.left>0 && g.id!==myId);
  return pend.map(g => `<p class="pending">${ic('stopwatch')} ${esc(nm(g.id))} ${g.mode==='buddy' ? 'kiest een drinkmaatje' : 'deelt nog '+g.left+' '+sl(g.left)+' uit'}…</p>`).join('');
}
function drinkList(res){
  const m = new Map();
  res.drinks.forEach(d => { const e = m.get(d.id) || {n:0, why:[]}; e.n += d.n; if(!e.why.includes(d.why)) e.why.push(d.why); m.set(d.id, e); });
  if(!m.size) return `<div class="empty">Niemand drinkt deze ronde ${ic('party')}</div>`;
  return `<div class="dl">${[...m.entries()].sort((a,b) => b[1].n-a[1].n).map(([id,e]) =>
    `<div class="row">${av(id)}<div class="nm">${esc(nm(id))}${(P(id)||{}).drive?' '+DRV:''}<small>${esc(e.why.join(', '))}</small></div><div class="n">${e.n || DRV}</div></div>`).join('')}</div>`;
}
function barsHtml(bars, opts){
  if(!bars || !bars.length) return '';
  const max = Math.max(1, ...bars.map(b => b.n));
  return `<div class="bars">${bars.map(b => `<div class="barrow ${b.hi?'hi':''}">
    <div class="bl"><span>${b.k!=null ? `<i class="shape">${SHAPES[b.k]}</i>` : ''}${b.id ? av(b.id) : ''}${esc(b.label)}${b.hi && opts && opts.check ? ' ✓' : ''}</span><b>${b.txt!=null ? b.txt : b.n}</b></div>
    <div class="bt"><i style="width:${Math.round(b.n/max*100)}%;background:${b.k!=null ? `var(--k${b.k})` : (b.color || 'var(--mute)')}"></i></div></div>`).join('')}</div>`;
}

function viewResult(){
  const res = S.res, r = S.r; if(!res) return '';
  let label = '';
  if(res.type==='rad') label = ic('refresh')+' Het Rad';
  else if(res.type==='bq') label = `${ic('cards')} Bussen · ${BUSQ[res.q-1].t}`;
  else if(res.mini) label = `${modeInfo(res.type).e} ${modeInfo(res.type).l}`;
  else label = `${TYPES[res.type].e} ${TYPES[res.type].l}`;
  let h = `<div class="rhead"><span class="pill">${label}</span><span class="pill">Uitslag</span></div>`;
  if(res.mini){
    const bodyH = miniResView(res);
    if(res.revealAt && hnow() < res.revealAt) return h + bodyH;
    const first = ['wof','getal','emo','wnw','verb','wbi'].includes(res.type);
    if(first) h += bodyH;
    if(res.note) h += `<p class="note">${esc(res.note)}</p>`;
    h += personal(res, false) + pendingOthers(res);
    if(!first) h += bodyH;
    return h + `<h3>${res.type==='wof' ? 'Strafpunten deze vraag' : 'Wie drinkt er'}</h3>` + drinkList(res);
  }
  if(res.type==='rad'){
    h += `<div class="dare"><span class="tagl">${res.cat==='Flirt'?'💋':ic('fire')} ${esc(res.cat)} · #${res.nr}</span><div class="txt">${esc(res.dare)}</div></div>`;
  } else if(res.type==='quiz') h += `<div class="q">${esc(res.q)}</div>`;
  else if(res.type==='likely') h += `<p class="pre">Wie is het meest waarschijnlijk om…</p><div class="q">${esc(res.q)}?</div>`;
  else if(res.type==='never') h += `<p class="pre">Ik heb nog nooit…</p><div class="q">${esc(res.q)}</div>`;
  else if(res.type==='tot') h += `<div class="q">${esc(res.q)}</div>`;
  else if(res.type==='bq' && res.cards[myId]){
    const c = res.cards[myId];
    h += `<div class="hand" style="margin-top:16px">${cardHtml(c.c,'big','bq'+S.r.t0)}</div><p class="center ${c.ok?'ok':'ko'}">${c.ok ? 'Goed geraden!' : c.v==null ? 'Geen antwoord gegeven' : 'Fout geraden'}</p>`;
  } else if(res.type==='wheel'){
    const map = {drink:ic('beer')+' Drinken', give:ic('star')+' Uitdelen', buddy:ic('cheers')+' Drinkmaatje', all:ic('shots')+' Iedereen drinkt', safe:ic('thumbup')+' Veilig'};
    h += `<div class="turn" style="margin-top:16px">${av(res.who)}<span>${esc(nm(res.who))}: ${map[res.out]}</span></div>`;
  }
  if(res.note) h += `<p class="note">${esc(res.note)}</p>`;
  h += personal(res, false);
  h += pendingOthers(res);
  if(res.type==='quiz') h += `<h3>Antwoorden</h3>` + barsHtml(res.bars, {check:true});
  else if(res.type==='likely') h += `<h3>Stemmen</h3>` + (res.bars.length ? barsHtml(res.bars) : `<div class="empty">Geen stemmen</div>`);
  else if(res.type==='never' || res.type==='tot') h += `<h3>Antwoorden</h3>` + barsHtml(res.bars);
  else if(res.type==='tap') h += `<h3>Reactietijden</h3>` + (res.bars.length ? barsHtml(res.bars) : `<div class="empty">Niemand op tijd</div>`);
  else if(res.type==='bq'){
    h += `<h3>Getrokken kaarten</h3><div class="dl cardlist">${Object.keys(res.cards).map(id => { const c = res.cards[id];
      return `<div class="row">${av(id)}<div class="nm">${esc(nm(id))}<small>${c.v==null ? 'Geen antwoord' : esc(BUSQ[res.q-1].o[c.v])}</small></div>${cardHtml(c.c)}<span class="${c.ok?'ok':'ko'}">${c.ok?'✓':'✗'}</span></div>`; }).join('')}</div>`;
  }
  h += `<h3>Wie drinkt er</h3>` + drinkList(res);
  return h;
}

function viewEnd(){
  const rows = S.players.slice().sort((a,b) => b.drunk-a.drunk || b.given-a.given);
  const king = rows[0], hist = S.hist || [];
  const total = rows.reduce((t,p) => t+p.drunk, 0);
  let h = '';
  if(king && king.drunk){
    h += `<div class="king">${av(king.id,'xl')}<div class="kcrown">${ic('crown')}</div>
      <div class="klbl">Slokkoning${king.drive ? ' '+DRV : ''}</div><div class="kname">${esc(king.name)}</div>
      <div class="ksub">${king.drunk} ${sl(king.drunk)} gedronken${rows[1] && rows[1].drunk===king.drunk ? ' (gedeeld met '+esc(rows[1].name)+')' : ''}</div></div>`;
  } else h += `<div class="crown">${ic('trophy')}</div><div class="etitle">Eindstand</div>`;
  // prijzen
  const aw = [];
  const giver = S.players.slice().sort((a,b) => b.given-a.given)[0];
  if(giver && giver.given) aw.push([ic('star'),'Grootste uitdeler', esc(giver.name), giver.given+' uitgedeeld']);
  if(rows.length>1){ const low = rows[rows.length-1]; aw.push([ic('check'),'Heilig boontje', esc(low.name), low.drunk+' '+sl(low.drunk)]); }
  let heavy = null;
  hist.forEach(e => { const t = Object.values(e.d||{}).reduce((a,b) => a+b, 0); if(!heavy || t>heavy.t) heavy = {e, t}; });
  if(heavy && heavy.t) aw.push([ic('skull'),'Zwaarste ronde', esc(heavy.e.label), heavy.t+' '+sl(heavy.t)+(S.mode==='bus' ? '' : ' · ronde '+heavy.e.n)]);
  aw.push([ic('beer'),'Totaal', total+' '+sl(total), hist.length+' '+(hist.length===1?'ronde':'rondes')+' gespeeld']);
  h += `<div class="awards">${aw.map(a => `<div class="award"><span class="ae">${a[0]}</span><small>${a[1]}</small><b>${a[2]}</b><span class="as">${a[3]}</span></div>`).join('')}</div>`;
  if(S.mode==='bus' && S.bus && S.bus.ride){
    const R = S.bus.ride;
    h += `<div class="busnote">🚌 ${esc(nm(S.bus.driver))} ${R.st==='win' ? `is uit de bus na ${R.tries} ${R.tries===1?'poging':'pogingen'} (${R.total} ${sl(R.total)})` : `zat nog in de bus (${R.total} ${sl(R.total)})`}</div>`;
  }
  h += `<h3>Eindstand</h3><div class="etab"><div class="erow th"><span>#</span><span>Speler</span><span class="center">Gedronken</span><span class="center">${['wof','dow'].includes(S.mode) ? 'Straf­punten' : 'Uitgedeeld'}</span></div>
    ${rows.map((p,i) => `<div class="erow ${i===0 && p.drunk ? 'first' : ''}"><span class="rk">${i+1}</span><span class="who">${av(p.id)}${esc(p.name)}${p.drive?' '+DRV:''}</span><span class="num">${p.drunk}</span><span class="num g">${['wof','dow'].includes(S.mode) ? ((S.pen||{})[p.id]||0) : p.given}</span></div>`).join('')}</div>`;
  if(hist.length){
    h += `<h3>Alles wat er gebeurd is</h3><div class="hist">${hist.map(e => {
      const d = Object.entries(e.d||{}).filter(x => x[1]>0).sort((a,b) => b[1]-a[1]);
      const t = d.reduce((a,x) => a+x[1], 0);
      return `<details><summary><span class="hn disp">${e.n}</span><span class="ht"><b>${esc(e.label)}</b><small>${esc(e.text || e.note || '')}</small></span><span class="hs">${t} ${ic('beer')}</span></summary>
        <div class="hd">${e.note && e.text ? `<p>${esc(e.note)}</p>` : ''}${d.length ? `<div class="chips">${d.map(([id,n]) => `<span class="chip">${av(id)}${esc(nm(id))} · ${n}</span>`).join('')}</div>` : '<p>Niemand hoefde te drinken.</p>'}</div></details>`;
    }).join('')}</div>`;
  }
  if(role!=='host') h += waitBox('Wachten op de host', 'Nog een potje of afsluiten?') + `<button class="link" data-a="leave">Spel verlaten</button>`;
  return h;
}

function viewSum(){
  const c = S.cm || {}, d = S.cur || {};
  const rows = Object.entries(d).filter(x => x[1]>0 && P(x[0])).sort((a,b) => b[1]-a[1]);
  const mine = d[myId] || 0, others = rows.filter(x => x[0]!==myId);
  let h = `<div class="rhead"><span class="pill">${ic('cards')} ${esc(c.label || 'Bussen')}</span><span class="pill">Overzicht</span></div>`;
  if(mine) h += `<div class="sumtop red" data-anim="sum-${S.gid}-${c.n}-${c.label}"><div class="n disp">${ic('beer')}${mine}</div><div class="t">Jij moet ${mine} ${sl(mine)} nemen!</div><small>${(P(myId)||{}).drive ? DRV+' Rijmodus staat aan' : 'Proost!'}</small></div>`;
  else h += `<div class="sumtop green" data-anim="sum-${S.gid}-${c.n}-${c.label}"><div class="n">${ic('thumbup')}</div><div class="t">Jij hoeft niks te drinken</div><small>${rows.length ? 'Maar deze mensen wel:' : 'Deze ronde drinkt niemand.'}</small></div>`;
  if(S.res && S.res.gives){ if(S.res.gives.some(g => g.id===myId && g.left>0)) h += personal(S.res, true); h += pendingOthers(S.res); }
  if(others.length) h += `<h3>${mine ? 'Ook drinken' : 'Wie moet er drinken'}</h3><div class="pz-list">${others.map(([id,n]) => `<div class="pz-row">${av(id,'lg')}<span class="nm">${esc(nm(id))}${(P(id)||{}).drive?' '+DRV:''}</span><span class="n disp">${n}</span></div>`).join('')}</div>`;
  if(role!=='host') h += waitBox('Even drinken', 'De host gaat zo verder.');
  return h;
}
/* ---------- minigames en Wel of Niet: schermen ---------- */
const RPS = [['✊','Steen'],['✋','Papier'],['✌️','Schaar']];
function inBox(id, ph, action, max){
  const k = id+'|'+rkey();
  return `<div class="inrow"><input id="${id}" class="inp" data-keep="${k}" data-enter="${action}" maxlength="${max||40}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="${ph}" value="${esc(ui.val[k]||'')}"><button class="btn cream" data-a="${action}" data-in="${id}" aria-label="Versturen">${ic('check')}</button></div>`;
}
function timerHead(label, dl, tot, extra){
  return `<div class="rhead"><span class="pill">${label}</span>${extra||''}<span class="tnum disp" data-dl="${dl}"></span></div><div class="tbar"><i data-dl="${dl}" data-tot="${tot}"></i></div>`;
}
function turnLine(id){ return `<div class="turn">${av(id)}<span>${id===myId ? 'Jij bent aan de beurt!' : esc(nm(id))+' is aan de beurt'}</span></div>`; }
function usedList(list, rev){
  const l = rev ? list.slice().reverse() : list;
  return `<div class="used">${l.map(u => `<span class="${u.ok ? 'okg' : ''}">${u.w!=null ? esc(u.w) : (u.g ? esc(u.g) : '(geen gok)')} <small>· ${esc(nm(u.id))}</small></span>`).join('')}</div>`;
}
function modeInfo(t){ return t==='wof' ? WOF : MINI[t]; }

function viewMini(r){
  const M = modeInfo(r.type), label = `${M.e} ${M.l}`;
  const inR = r.ids.includes(myId), mine = inR ? myAns() : null, T = hnow();
  if(!inR) return head(label, r) + waitBox('Even wachten', 'Je doet vanaf de volgende ronde mee.');
  let h = '';
  switch(r.type){
    case 'snel': {
      if(r.stage==='ready'){
        const el = eligible(r), n = el.filter(id => r.ready[id]).length;
        h = head(label, r) + `<div class="q center" style="margin-top:18px">Vinger klaar?</div><p class="sub center">Als iedereen klaar is, komt er na 2 tot 7 seconden een signaal. Wie het langzaamst tikt, verliest.</p>`;
        h += r.ready[myId] ? waitBox('Jij bent klaar!', 'Wachten tot iedereen klaar is…') : `<button class="btn cream pulse" data-a="ready">${ic('thumbup')} Ik ben klaar</button>`;
        return h + `<h3>Klaar (${n}/${el.length})</h3><div class="chips">${r.ids.map(id => `<span class="chip ${r.ready[id] ? '' : 'off'}">${av(id)}${esc(nm(id))}${r.ready[id] ? ' ✓' : ''}</span>`).join('')}</div>`;
      }
      const go = T >= r.goAt;
      h = head(label, {});
      if(mine) h += `<button class="tapbtn done">${mine.early ? 'Te vroeg!' : 'Getikt!'}</button>`;
      else h += `<button class="tapbtn ${go ? 'go' : 'wait'}" data-tap="1">${go ? 'NU!' : 'Wacht…'}</button>`;
      return h + `<p class="sub center">Tik zodra de knop groen wordt. Te vroeg tikken is ook verliezen.</p>` + countLine(r);
    }
    case 'react': {
      h = head(label, {});
      if(mine) return h + `<button class="tapbtn done">${mine.early ? 'Te vroeg!' : 'Getikt!'}</button>` + countLine(r);
      if(T < r.cd) return h + `<div class="cdown"><span data-dl="${r.cd}"></span></div><p class="sub center">Maak je klaar. Tik zodra het scherm van kleur verandert!</p>`;
      if(T < r.goAt) return h + `<div class="waitpad" data-tap="1">Wacht op de kleur…</div><p class="sub center">Nog niet tikken!</p>`;
      return h + `<div class="react" data-tap="1" style="background:${r.col}">TIK!</div>`;
    }
    case 'getal': {
      h = head(label, r) + `<div class="q center" style="margin-top:14px">Welk getal tussen 1 en 20?</div><p class="sub center">Wie er het verst naast zit, verliest. Precies goed? Dan mag je uitdelen.</p>`;
      if(mine) h += `<div class="bigreveal"><div class="n disp">${esc(mine.v)}</div><small>jouw gok</small></div>` + waitBox('Gok binnen!');
      else h += `<div class="numgrid">${Array.from({length:20}, (_,i) => `<button data-a="ans" data-v="${i+1}">${i+1}</button>`).join('')}</div>`;
      return h + countLine(r);
    }
    case 'cat': {
      const cur = curTurn(r);
      h = timerHead(label, r.tdl, r.used.length ? 12000 : 20000);
      h += `<p class="pre center">Categorie</p><div class="q center">${esc(r.cat)}</div>` + turnLine(cur);
      if(cur===myId){
        if(r.msg) h += `<p class="err">${esc(r.msg)}</p>`;
        h += inBox('catin', 'Jouw antwoord…', 'sendText', 40) + `<button class="link" data-a="catPass">Ik weet niks meer</button>`;
      } else h += `<p class="sub center">Om de beurt een antwoord. Wie niks meer weet of te laat is, verliest.</p>`;
      return h + `<h3>Al genoemd (${r.used.length})</h3>` + (r.used.length ? usedList(r.used, true) : `<div class="empty">Nog niets genoemd</div>`);
    }
    case 'verb': {
      h = head(label, {});
      const sp = r.variant==='speler';
      if(sp && r.target===myId) return h + `<div class="bigword">🤐 ? ? ?</div><div class="q center">Er is een verboden woord voor jou!</div><p class="sub center">De rest probeert jou dat woord te laten zeggen. Let goed op je woorden.</p>`;
      h += `<p class="pre center">${sp ? 'Het verboden woord voor '+esc(nm(r.target)) : 'Het verboden woord is'}</p><div class="bigword">${ic('mute')} ${esc(r.word)}</div>`;
      h += `<p class="sub center">${sp ? 'Laat '+esc(nm(r.target))+' dit woord zeggen zonder dat het opvalt. '+esc(nm(r.target))+' ziet het woord niet.' : 'Niemand mag dit woord zeggen. Praat gewoon verder… Wie het zegt, verliest.'}</p>`;
      if(sp) h += `<button class="btn red" data-a="said" data-id="${r.target}">${ic('cross')} ${esc(nm(r.target))} zei het!</button>`;
      else if(ui.verbPick===rkey()) h += `<h3>Wie zei het?</h3><div class="pgrid">${r.ids.map(id => `<button class="pbtn" data-a="said" data-id="${id}">${av(id)}<span>${esc(nm(id))}</span></button>`).join('')}</div><button class="link" data-a="verbPick">Annuleren</button>`;
      else h += `<button class="btn red" data-a="verbPick">${ic('cross')} Iemand zei het!</button>`;
      return h;
    }
    case 'wbi': {
      const cur = curTurn(r), left = r.max - r.guesses.length;
      h = timerHead(label, r.tdl, 25000);
      h += `<div class="hints">${r.h.slice(0, r.shown).map((t,i) => `<div class="hint-c" data-anim="h${r.t0}-${i}"><b>${i+1}</b><span>${esc(t)}</span></div>`).join('')}</div>`;
      h += `<p class="sub center">Hint ${r.shown} van ${r.h.length} · nog ${left} ${left===1 ? 'gok' : 'gokken'}</p>` + turnLine(cur);
      if(cur===myId) h += inBox('wbiin', 'Wie is het?', 'sendText', 50);
      if(r.guesses.length) h += `<h3>Fout geraden</h3>` + usedList(r.guesses, true);
      return h;
    }
    case 'mem': {
      if(r.stage==='show') return head(label, r) + `<div class="q center" style="margin-top:12px">Onthoud deze woorden!</div><div class="wordgrid">${r.words.map((w,i) => `<div class="word" style="animation-delay:${i*.05}s">${esc(w)}</div>`).join('')}</div>`;
      h = head(label, r, r.ts);
      if(mine) return h + waitBox('Ingeleverd!', `Je hebt ${mine.v.length} ${mine.v.length===1 ? 'woord' : 'woorden'} ingevuld. Wachten op de rest…`) + countLine(r);
      const list = ui.mem[rkey()] || [];
      h += `<div class="q center" style="margin-top:12px">Welke woorden weet je nog?</div>` + inBox('memin', 'Typ een woord…', 'memAdd', 40);
      h += list.length ? `<div class="used">${list.map((w,i) => `<button class="tagx" data-a="memDel" data-i="${i}">${esc(w)} ✕</button>`).join('')}</div>` : `<p class="sub center">Typ een woord en druk op enter. Meerdere woorden tegelijk mag ook.</p>`;
      return h + `<button class="btn cream" data-a="memSend" ${list.length ? '' : 'disabled'}>${ic('check')} Inleveren (${list.length})</button>` + countLine(r);
    }
    case 'emo': {
      h = head(label, r) + `<div class="center" style="margin-top:12px"><span class="pill">${esc(r.c)}</span></div><div class="emo">${esc(r.e)}</div>`;
      h += mine ? waitBox('Gok binnen!', 'Jij zei: '+esc(mine.v)) : inBox('emoin', 'Wat is het?', 'sendText', 60);
      return h + countLine(r);
    }
    case 'rps': {
      h = `<div class="rhead"><span class="pill">${label}</span><span class="pill">Worp ${r.sub}</span>${r.stage==='pick' ? `<span class="tnum disp" data-dl="${r.dl}"></span>` : ''}</div>`;
      if(r.stage==='show'){
        const L = r.rounds[r.rounds.length-1];
        h += `<div class="q center" style="margin-top:16px">${L.out.length ? (L.out.length===1 ? esc(nm(L.out[0]))+' ligt eruit!' : L.out.length+' spelers liggen eruit!') : 'Gelijkspel, nog een keer!'}</div>`;
        return h + `<div class="rpsrev">${L.all.map((id,i) => `<div class="${L.out.includes(id) ? 'out' : ''}" style="animation-delay:${i*.12}s"><span>${L.picks[id]!=null ? RPS[L.picks[id]][0] : '💤'}</span>${esc(nm(id))}</div>`).join('')}</div>`;
      }
      if(!r.alive.includes(myId)) h += waitBox('Je ligt eruit', 'Kijk maar wie er wint…');
      else if(mine) h += waitBox(`${RPS[mine.v][0]} ${RPS[mine.v][1]}`, 'Wachten op de rest…');
      else h += `<div class="q center" style="margin-top:14px">Kies!</div><div class="rps">${RPS.map((x,i) => `<button data-a="ans" data-v="${i}"><span>${x[0]}</span>${x[1]}</button>`).join('')}</div>`;
      return h + `<h3>Nog in het spel (${r.alive.length})</h3><div class="chips">${r.alive.map(id => `<span class="chip">${av(id)}${esc(nm(id))}${r.ans[id] ? ' ✓' : ''}</span>`).join('')}</div>`;
    }
    case 'wnw': {
      h = head(label, r) + `<div class="fact">${esc(r.f)}</div>`;
      h += mine ? waitBox(mine.v===0 ? 'Jij zegt: waar' : 'Jij zegt: niet waar') : `<div class="two" style="grid-template-columns:1fr 1fr"><button class="bigopt o-green" data-a="ans" data-v="0">${ic('check')} Waar</button><button class="bigopt o-red" data-a="ans" data-v="1">${ic('cross')} Niet waar</button></div>`;
      return h + countLine(r);
    }
    case 'wof': {
      h = head(label, r) + `<div class="wofq"><span class="tagl">${ic('fire')} Spice Edition</span><div>${esc(r.q)}</div></div>`;
      h += `<div class="yn">${['JA','NEE'].map((t,i) => `<button class="${i ? 'nee' : 'ja'} ${mine ? (mine.v===i ? 'sel' : 'dim') : ''}" ${mine ? 'disabled' : `data-a="ans" data-v="${i}"`}>${t}</button>`).join('')}</div>`;
      return h + `<p class="sub center" style="margin-top:16px">${mine ? 'Je antwoord blijft geheim tot iedereen gekozen heeft.' : 'Niemand ziet je antwoord tot iedereen gekozen heeft.'}</p>` + countLine(r);
    }
  }
  return h;
}

function miniResView(res){
  const rows = (list, f) => `<div class="dl">${list.map(f).join('')}</div>`;
  switch(res.type){
    case 'snel': case 'react': return `<h3>Reactietijden</h3>` + (res.bars.length ? barsHtml(res.bars) : `<div class="empty">Niemand tikte op tijd</div>`);
    case 'getal': return `<div class="bigreveal"><small>Het getal was</small><div class="n disp">${res.num}</div></div><h3>Gokken</h3>` +
      (res.rows.length ? rows(res.rows, x => `<div class="row">${av(x.id)}<div class="nm">${esc(nm(x.id))}<small>${x.d===0 ? 'Precies goed!' : x.d+' ernaast'}</small></div><div class="n" style="color:var(--cream)">${x.v}</div></div>`) : `<div class="empty">Niemand heeft geraden</div>`);
    case 'cat': return `<p class="pre center">Categorie</p><div class="q center">${esc(res.cat)}</div><h3>Genoemd (${res.used.length})</h3>` + (res.used.length ? usedList(res.used) : `<div class="empty">Niets genoemd</div>`);
    case 'verb': return `<p class="pre center">Het verboden woord was</p><div class="bigword">${ic('mute')} ${esc(res.word)}</div>` +
      (res.out ? `<div class="turn">${av(res.out.id)}<span>${esc(nm(res.out.id))} zei het${res.out.by && res.out.by!==res.out.id ? ' (gemeld door '+esc(nm(res.out.by))+')' : ''}</span></div>` : '');
    case 'wbi': return `<p class="pre center">Het was</p><div class="bigword cream">${esc(res.n)}</div><div class="hints">${res.h.map((t,i) => `<div class="hint-c"><b>${i+1}</b><span>${esc(t)}</span></div>`).join('')}</div>` +
      (res.guesses.length ? `<h3>Gokken</h3>` + usedList(res.guesses) : '');
    case 'mem': return `<h3>De woorden</h3><div class="wordgrid">${res.words.map(w => `<div class="word">${esc(w)}</div>`).join('')}</div><h3>Onthouden</h3>` +
      rows(res.rows, x => `<div class="row">${av(x.id)}<div class="nm">${esc(nm(x.id))}<small>${esc(x.hit.join(', ') || 'geen enkele')}</small></div><div class="n" style="color:var(--cream)">${x.ok}</div></div>`);
    case 'emo': return `<div class="center" style="margin-top:12px"><span class="pill">${esc(res.c)}</span></div><div class="emo">${esc(res.e)}</div><div class="verdict t">${esc(res.a)}</div>` +
      (res.rows.length ? `<h3>Gokken</h3>` + rows(res.rows, x => `<div class="row">${av(x.id)}<div class="nm">${esc(nm(x.id))}<small>${esc(x.v)}</small></div><span class="${x.ok ? 'ok' : 'ko'}">${x.ok ? '✓' : '✗'}</span></div>`) : '');
    case 'rps': return (res.winner ? `<div class="turn" style="margin-top:14px">${av(res.winner,'lg')}<span>${esc(nm(res.winner))} wint! ${ic('trophy')}</span></div>` : '') + `<h3>Alle worpen</h3>` +
      rows(res.rounds, (x,i) => `<div class="row"><div class="nm">Worp ${i+1}<small>${x.all.map(id => (x.picks[id]!=null ? RPS[x.picks[id]][0] : '💤')+' '+esc(nm(id))).join(' · ')}</small></div><span class="${x.out.length ? 'ko' : 'ok'}" style="font-size:14px;text-align:right">${x.out.length ? x.out.map(id => esc(nm(id))).join(', ')+' eruit' : 'gelijk'}</span></div>`);
    case 'wnw': return `<div class="fact">${esc(res.f)}</div><div class="verdict ${res.w ? 't' : 'f'}">${res.w ? 'Waar!' : 'Niet waar!'}</div><p class="sub">${esc(res.x)}</p><h3>Scorebord waar of niet waar</h3>` +
      rows(res.board, x => `<div class="row">${av(x.id)}<div class="nm">${esc(nm(x.id))}</div><div class="n" style="color:var(--green)">${x.s}</div></div>`);
    case 'wof': {
      if(res.revealAt && hnow() < res.revealAt) return `<div class="wofq"><span class="tagl">${ic('fire')} Spice Edition</span><div>${esc(res.q)}</div></div><div class="reveal-c"><p class="pre">Iedereen heeft gekozen. De onthulling over…</p><div class="cd disp" data-dl="${res.revealAt}"></div></div>`;
      const n = res.ja.length + res.nee.length, pj = n ? Math.round(res.ja.length/n*100) : 0, pn = n ? 100 - pj : 0;
      const tag = k => res.minority===k ? `<i class="minor">MINDERHEID</i>` : '';
      let h = `<div class="wofq small"><div>${esc(res.q)}</div></div>`;
      h += `<div class="splitlbl"><span>JA · ${res.ja.length} (${pj}%) ${tag('ja')}</span><span>${tag('nee')} NEE · ${res.nee.length} (${pn}%)</span></div>`;
      h += `<div class="split">${pj ? `<div class="ja" style="flex:${pj}">${pj}%</div>` : ''}${pn ? `<div class="nee" style="flex:${pn}">${pn}%</div>` : ''}${!n ? '<div class="none">Geen stemmen</div>' : ''}</div>`;
      const all = res.ja.map(id => [id,'ja']).concat(res.nee.map(id => [id,'nee']));
      return h + `<div class="votes">${all.map(([id,k],i) => `<div class="vote ${k} ${res.minority===k ? 'min' : ''}" style="animation-delay:${.35+i*.12}s">${av(id)}<span>${esc(nm(id))}</span><b>${k.toUpperCase()}</b></div>`).join('')}</div>`;
    }
  }
  return '';
}

function viewDow(r){

      if(r.lock) h += `<p class="lockmsg">${ic('lock')}<span>${isMe ? 'Je koos' : esc(nm(who))+' koos'} twee keer achter elkaar waarheid. Nu is het doen!</span></p>`;

      <div class="slot"><div class="slot-win"><div class="reel" style="--to:-${(r.reel.length-1)*72}px;animation-delay:-${Math.round(el/100)*100}ms">${r.reel.map(id => `<div class="si">${av(id)}<span>${esc(nm(id))}</span></div>`).join('')}</div></div>
      <p>${r.opp ? 'Het rad kiest iemand van het andere geslacht…' : 'Het rad kiest een speler…'}</p></div>`;

    else h += waitBox(r.target===myId ? 'Jij doet mee met '+esc(nm(who))+'!' : 'Wachten op '+esc(nm(who))+'…', 'Voltooid of overgeslagen?');

function viewBar(){
  if(role!=='host' || !S) return '';
  let prim = null, sec = null, stop = true;
  const r = S.r;
  if(S.phase==='lobby'){ prim = ['start',ic('party')+' Start','pulse']; stop = false; }
  else if(S.phase==='play'){
    if(r.type==='pyr') prim = rowDone(S.bus) ? ['sum',`Overzicht rij ${rowOf(S.bus.flip-1)}`] : ['flip',`Draai kaart ${S.bus.flip+1}/15`];
    else if(r.type==='ride') prim = S.bus.ride.st==='win' ? ['sum','Overzicht'] : null;
    else if(r.type==='rad' && r.stage==='dare') prim = null;
    else if(r.type==='dow') prim = null;
    else if(r.type==='cat') prim = r.used.length ? ['catReject','Laatste antwoord afkeuren'] : ['stopTime','Stop de ronde'];
    else if(r.type==='verb') prim = ['stopTime','Niemand zei het'];
    else if(['wbi','rps'].includes(r.type)) prim = ['stopTime','Stop de ronde'];
    else prim = ['stopTime','Stop de tijd'];
  } else if(S.phase==='result'){
    const pend = S.res && S.res.gives.some(g => g.left>0);
    if(pend) prim = ['skipGives','Uitdelen overslaan'];
    else if(S.mode==='bus') prim = ['sum','Overzicht'];
    else prim = ['next', S.n>=S.total ? ic('flag')+' Naar eindstand' : S.mode==='wof' ? 'Volgende vraag' : 'Volgende ronde'];
    if(!pend && S.mode!=='bus') sec = ['restart', ic('refresh'), 'sq'];
  } else if(S.phase==='sum'){
    const B = S.bus;
    if(S.res && S.res.gives && S.res.gives.some(g => g.left>0)) prim = ['skipGives','Uitdelen overslaan'];
    else if(B.stage==='guess') prim = ['next', S.r.q<4 ? 'Volgende kaart' : 'Naar de piramide'];
    else if(B.stage==='pyr') prim = ['next', B.sumRow<5 ? 'Naar rij '+(B.sumRow+1) : 'Wie moet de bus in?'];
    else prim = ['next',ic('flag')+' Naar eindstand'];
  } else if(S.phase==='end'){ prim = ['again',ic('refresh')+' Nog een potje','pulse']; sec = ['close','Afsluiten']; stop = false; }
  else return '';
  return `<div class="in barin">
    ${stop ? `<button class="btn stop" data-a="stop">Stop</button>` : ''}
    ${sec ? (sec[2]==='sq' ? `<button class="btn ghost sq" data-a="${sec[0]}" aria-label="Ronde opnieuw">${sec[1]}</button>` : `<button class="btn ghost" style="width:auto;flex:1" data-a="${sec[0]}">${sec[1]}</button>`) : ''}
    ${prim ? `<button class="btn cream ${prim[2]||''}" style="flex:1.4" data-a="${prim[0]}">${prim[1]}</button>` : ''}
  </div>`;
}

/* ================= Acties ================= */
const isHost = () => role==='host' && S;
const A = {
  join(){
    if(!PROF) return;
    const ci = $('#code');
    if(ci) ui.joinCode = ci.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
    if(ui.joinCode.length!==4){ ui.err = 'Vul een code van 4 letters in.'; render(); return; }
    ui.err = ''; C.wasIn = false; clientJoin(ui.joinCode);
  },
  create(){ if(!PROF) return; ui.err = ''; hostCreate(); },
  // profielen
  newProfile(){ ui.auth = 'new'; ui.form = {name:'', pass:'', avatar:'', gender:''}; ui.err = ''; render(); },
  pickProfile(d){ ui.auth = {login:d.id}; ui.form = {name:'', pass:'', avatar:''}; ui.err = ''; render(); const i = $('#lpass'); if(i) i.focus(); },
  authBack(){ ui.auth = null; ui.form = null; ui.err = ''; render(); },
  async doCreate(){
    const f = ui.form || {}; const name = (f.name||'').trim().slice(0,16), pass = f.pass || '';
    if(!name){ ui.err = 'Vul je naam in.'; render(); return; }
    if(pass.length < 4){ ui.err = 'Kies een wachtwoord van minstens 4 tekens.'; render(); return; }
    if(f.gender!=='boy' && f.gender!=='girl'){ ui.err = 'Kies of je een jongen of een meisje bent.'; render(); return; }
    const ps = profiles();
    if(Object.values(ps).some(p => p.name.toLowerCase()===name.toLowerCase())){ ui.err = 'Er is al een profiel met die naam op deze telefoon. Log daarmee in.'; render(); return; }
    try{
      const salt = rid(16), id = 'u'+rid(6);
      const p = {id, name, salt, hash:await hashPw(pass, salt), avatar:f.avatar || '', gender:f.gender, token:rid(12), drive:false, stats:{games:0, drunk:0, given:0}, counted:[], used:Date.now()};
      ps[id] = p; saveProfiles(ps);
      ui.auth = null; ui.form = null; ui.err = ''; setProfile(p); render();
      toast('Welkom, '+name+'!');
    }catch(e){ ui.err = 'Profiel maken lukte niet in deze browser.'; render(); }
  },
  async doLogin(){
    const p = profiles()[ui.auth && ui.auth.login]; if(!p) return A.authBack();
    const pass = (ui.form && ui.form.pass) || '';
    let ok = false; try{ ok = (await hashPw(pass, p.salt))===p.hash; }catch(e){}
    if(!ok){ ui.err = 'Wachtwoord klopt niet.'; ui.form.pass = ''; render(); return; }
    const ps = profiles(); ps[p.id].used = Date.now(); saveProfiles(ps);
    ui.auth = null; ui.form = null; ui.err = ''; setProfile(ps[p.id]); render();
  },
  logout(){ setProfile(null); ui.err = ''; render(); },
  delProfile(){
    if(!PROF || !confirm('Profiel "'+PROF.name+'" en de statistieken van deze telefoon verwijderen?')) return;
    const ps = profiles(); delete ps[PROF.id]; saveProfiles(ps); setProfile(null); render();
  },
  leave(){ if(confirm('Weet je zeker dat je het spel wilt verlaten?')) leave(); },
  leaveNow(){ leave(); },
  codeTap(){ if(role==='player') A.leave(); else if(S) toast('Spelcode: '+S.code); },
  share(){ if(navigator.share) navigator.share({title:'Slokkie', text:'Doe mee met Slokkie! Code: '+S.code, url:joinUrl()}).catch(() => {}); },
  copy(){ try{ navigator.clipboard.writeText(joinUrl()).then(() => toast('Link gekopieerd')); }catch(e){ toast(joinUrl()); } },
  drive(){ const p = P(myId); const on = !(p && p.drive); updateProfile(q => q.drive = on); act({t:'drive', on}); },
  ans(d){
    if(!S || !S.r) return;
    const v = /^\d+$/.test(d.v) ? +d.v : d.v;
    if(!['ride','rad','dow'].includes(S.r.type)) ui.sent = {k:rkey(), v};
    act({t:'answer', v}); render();
  },
  tap(){
    const r = S && S.r;
    if(!r || !['tap','snel','react'].includes(r.type) || S.phase!=='play' || !r.ids.includes(myId) || myAns()) return;
    if(r.type==='snel' && r.stage!=='go') return;
    const at = hnow();
    ui.sent = {k:rkey(), v:'tap', early: at < r.goAt};
    try{ navigator.vibrate && navigator.vibrate(30); }catch(e){}
    act({t:'answer', v:'tap', at}); render();
  },
  give(d){ act({t:'give', to:d.id}); },
  ready(){ act({t:'answer', v:'ready'}); },
  sendText(d, el){
    const inp = document.getElementById(d.in || (el && el.id)); if(!inp) return;
    const v = inp.value.trim(); if(!v) return;
    ui.val[inp.dataset.keep] = ''; inp.value = '';
    if(S.r && S.r.type==='emo') ui.sent = {k:rkey(), v};
    act({t:'answer', v}); render();
    const again = document.getElementById(inp.id); if(again) again.focus();
  },
  catPass(){ if(confirm('Weet je echt niks meer? Dan lig je eruit.')) act({t:'answer', v:'pass'}); },
  verbPick(){ ui.verbPick = ui.verbPick===rkey() ? null : rkey(); render(); },
  said(d){ act({t:'answer', v:'said', who:d.id}); ui.verbPick = null; render(); },
  memAdd(d, el){
    const inp = document.getElementById(d.in || (el && el.id)); if(!inp) return;
    const k = rkey(), list = ui.mem[k] || (ui.mem[k] = []);
    inp.value.split(/[,;\s]+/).map(w => w.trim().toLowerCase().slice(0,30)).filter(Boolean).forEach(w => { if(!list.includes(w) && list.length<20) list.push(w); });
    inp.value = ''; ui.val[inp.dataset.keep] = ''; render();
    const again = document.getElementById('memin'); if(again) again.focus();
  },
  memDel(d){ const l = ui.mem[rkey()]; if(l){ l.splice(+d.i, 1); render(); } },
  memSend(){ const l = ui.mem[rkey()] || []; if(!l.length) return; ui.sent = {k:rkey(), v:l.slice()}; act({t:'answer', v:l.slice()}); render(); },
  catReject(){
    if(!isHost() || !S.r || S.r.type!=='cat' || !S.r.used.length) return;
    const u = S.r.used[S.r.used.length-1];
    if(!confirm('"'+u.w+'" van '+nm(u.id)+' afkeuren? Dan ligt '+nm(u.id)+' eruit.')) return;
    S.r.out = {id:u.id, why:'"'+u.w+'" werd afgekeurd'}; endRound();
  },
  restart(){ if(isHost() && confirm('Deze ronde opnieuw starten? De slokken van deze ronde vervallen.')) restartRound(); },
  toLobby(){ if(isHost() && confirm('Terug naar de lobby? Het huidige spel stopt en de stand wordt gewist.')) A.again(true); },
  menu(){ ui.menu = !ui.menu; render(); },
  menuClose(){ ui.menu = false; render(); },
  sound(){ SND.on = !SND.on; store.set('sound', SND.on); if(SND.on){ ac(); setTimeout(() => sfx('join'), 30); } render(); },
  // host
  set(d){
    if(!isHost() || S.phase!=='lobby') return;
    const s = S.set;
    if(d.k==='mode'){ S.mode = d.v; if(d.v==='wof' && s.rounds>20) s.rounds = 20; }
    else if(d.k==='rounds') s.rounds = +d.v;
    else if(d.k==='intensity') s.intensity = d.v;
    else if(d.k==='type'){ s.types[d.v] = s.types[d.v] ? 0 : 1; if(!Object.values(s.types).some(Boolean)){ s.types[d.v] = 1; toast('Kies minstens één rondetype'); } }
    else if(d.k==='mini'){ s.mini = s.mini || allMini(); s.mini[d.v] = s.mini[d.v] ? 0 : 1; if(!Object.values(s.mini).some(Boolean)){ s.mini[d.v] = 1; toast('Kies minstens één minigame'); } }
    else if(d.k==='dow'){ s.dow = d.v==='spicy' ? 'spicy' : 'normaal'; }
    else if(d.k==='rad'){ s.rad[d.v] = s.rad[d.v] ? 0 : 1; if(!s.rad.flirt && !s.rad.drama){ s.rad[d.v] = 1; toast('Kies minstens één soort'); } }
    push();
  },
  kick(d){
    if(!isHost() || S.phase!=='lobby' || d.id===myId) return;
    if(!confirm(`${nm(d.id)} uit het spel halen?`)) return;
    S.players = S.players.filter(p => p.id!==d.id);
    Object.keys(H.tokens).forEach(t => { if(H.tokens[t]===d.id) delete H.tokens[t]; });
    H.conns.delete(d.id); push();
  },
  start(){
    if(!isHost() || S.phase!=='lobby') return;
    if(S.mode==='dow'){ const miss = S.players.filter(p => p.on && !p.g); if(miss.length){ toast(miss.map(p => p.name).join(', ')+' moet nog jongen of meisje kiezen'); return; } }
    wake(); hostStart();
  },
  gender(d){ if(d.v!=='boy' && d.v!=='girl') return; updateProfile(q => q.gender = d.v); me.gender = d.v; act({t:'gender', g:d.v}); },
  formGender(d){ ui.form = ui.form || {}; ui.form.gender = d.v; ui.err = ''; render(); },
  stopTime(){ if(!isHost() || S.phase!=='play') return;
    const r = S.r;
    if(r.type==='rad' && r.stage==='spin'){ r.stage = 'dare'; r.ts = Date.now(); r.dl = r.ts + 60000; push(); return; }
    endRound();
  },
  next(){ if(!isHost()) return;
    if(S.phase==='sum'){ busAfterSum(); return; }
    if(S.phase!=='result') return;
    if(S.mode==='bus') busSum();
    else nextRound();
  },
  skipGives(){ if(isHost() && S.res){ S.res.gives.forEach(g => g.left = 0); push(); } },
  flip(){ if(isHost()) busFlip(); },
  sum(){ if(isHost() && S.mode==='bus' && S.phase!=='sum') busSum(); },
  stop(){ if(isHost() && confirm('Spel stoppen en naar de eindstand?')) goEnd(); },
  again(){
    if(!isHost()) return;
    S.phase = 'lobby'; S.n = 0; S.r = null; S.res = null; S.bus = null; S.cm = null; S.hist = []; resetCur();
    S.players.forEach(p => { p.drunk = 0; p.given = 0; }); lastDrunk = null;
    push();
  },
  close(){
    if(!isHost() || !confirm('Het spel voor iedereen afsluiten?')) return;
    S.phase = 'closed'; push();
    setTimeout(hostTeardown, 700);
  }
};

document.addEventListener('click', e => {
  if(e.target.classList && e.target.classList.contains('sheetbg')){ ui.menu = false; render(); return; }
  const inMenu = !!e.target.closest('#menu');
  const el = e.target.closest('[data-a]');
  if(!el || el.disabled) return;
  const f = A[el.dataset.a];
  if(inMenu && el.dataset.a!=='menuClose' && el.dataset.a!=='sound'){ ui.menu = false; render(); }
  if(f){ e.preventDefault(); f(el.dataset, el); }
  wake();
});
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-tap]');
  if(el){ e.preventDefault(); A.tap(); }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if(e.target.dataset && e.target.dataset.keep) ui.val[e.target.dataset.keep] = e.target.value;
  if(ui.form && (id==='pname' || id==='ppass' || id==='lpass')){ if(id==='pname') ui.form.name = e.target.value; else ui.form.pass = e.target.value; }
  if(e.target.id==='code'){
    const v = e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
    if(v!==e.target.value) e.target.value = v;
    ui.joinCode = v;
  }
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && ui.menu){ ui.menu = false; render(); return; }
  if(e.key!=='Enter') return;
  const id = e.target.id;
  if(e.target.dataset && e.target.dataset.enter && A[e.target.dataset.enter]){ e.preventDefault(); A[e.target.dataset.enter]({in:id}, e.target); return; }
  if(id==='code'){ e.preventDefault(); A.join(); }
  else if(id==='lpass'){ e.preventDefault(); A.doLogin(); }
  else if(id==='ppass'){ e.preventDefault(); A.doCreate(); }
});
document.addEventListener('change', async e => {
  const t = e.target.dataset && e.target.dataset.file; if(!t || !e.target.files || !e.target.files[0]) return;
  try{
    const img = await fileToAvatar(e.target.files[0]);
    if(t==='new'){ ui.form = ui.form || {}; ui.form.avatar = img; }
    else if(t==='me'){ updateProfile(p => p.avatar = img); toast('Foto bijgewerkt'); }
    ui.err = ''; render();
  }catch(err){ ui.err = 'Die foto kon niet gelezen worden.'; render(); }
});

(function kisses(){
  const k = $('#kiss'); if(!k) return; let h = '';
  for(let i=0;i<18;i++) h += `<span style="--l:${(Math.random()*94).toFixed(1)}%;--s:${(22+Math.random()*28).toFixed(0)}px;--t:${(9+Math.random()*9).toFixed(1)}s;--d:-${(Math.random()*18).toFixed(1)}s;--b:${(Math.random()*90).toFixed(0)}%">${i%5===4 ? '😘' : '💋'}</span>`;
  k.innerHTML = h;
})();
(function boot(){
  const sid = store.get('session'); const sp = sid && profiles()[sid];
  if(sp) setProfile(sp);
  const lastGame = store.get('last');
  const linkCode = ui.joinCode;
  if(PROF && lastGame && lastGame.pid===PROF.id && Date.now() - lastGame.at < 8*3600*1000){
    if(lastGame.role==='host'){
      const saved = store.get('host');
      if(saved && saved.S && saved.S.code===lastGame.code && saved.S.phase!=='closed' && (!linkCode || linkCode===lastGame.code)){ hostResume(saved); return; }
    } else if(!linkCode || linkCode===lastGame.code){
      C.wasIn = true; clientJoin(lastGame.code); return;
    }
  }
  render();
})();
})();
